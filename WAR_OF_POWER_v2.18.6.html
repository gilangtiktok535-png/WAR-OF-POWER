    tailwind.config = {
      darkMode: 'class',

  <style>
    :root {
      --wop-bg: #070b14;
      --wop-card-bg: rgba(15, 23, 42, 0.88);
      --wop-border: rgba(56, 189, 248, 0.24);
      --wop-glow-1: rgba(6, 182, 212, 0.14);
      --wop-glow-2: rgba(245, 158, 11, 0.12);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100dvh;
      overflow-x: clip;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background-color: var(--wop-bg);
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    button, a, input, select, textarea {
      touch-action: pan-y manipulation;
    }
    .cyber-grid {
      background-color: var(--wop-bg);
      background-image:
        radial-gradient(circle at 20% 15%, var(--wop-glow-1), transparent 45%),
        radial-gradient(circle at 80% 85%, var(--wop-glow-2), transparent 45%),
        linear-gradient(to right, rgba(30, 41, 59, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(30, 41, 59, 0.35) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
    }
    .theme-bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.34;
      transition: background-image 0.5s ease, opacity 0.5s ease;
    }
    .snow-layer { position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; display:none; }
    .snow-layer.active { display:block; }
    .snow-layer::before,.snow-layer::after { content:attr(data-particles); position:absolute; top:-10%; left:0; width:100%; color:rgba(220,245,255,.75); font-size:18px; letter-spacing:22px; white-space:normal; line-height:72px; text-shadow:0 0 8px #7dd3fc; animation:snowFall 12s linear infinite; }
    .snow-layer::after { left:35%; opacity:.5; animation-duration:18s; animation-delay:-7s; }
    .snow-layer[data-effect='winter']::before,.snow-layer[data-effect='winter']::after { content:'❄ · ❅ · ❄ · ✧ · ❄ · '; }
    .snow-layer[data-effect='christmas']::before,.snow-layer[data-effect='christmas']::after { content:'🎄 · 🎅 · ✨ · 🎁 · ❄ · '; text-shadow:0 0 10px #fbbf24; }
    .snow-layer[data-effect='fire']::before,.snow-layer[data-effect='fire']::after { content:'🔥 · ✦ · 🔥 · ✧ · 🔥 · '; text-shadow:0 0 10px #fb923c; }
    .snow-layer[data-effect='halloween']::before,.snow-layer[data-effect='halloween']::after { content:'🎃 · 🦇 · ✦ · 👻 · 🎃 · '; text-shadow:0 0 10px #f97316; }
    .snow-layer[data-effect='galaxy']::before,.snow-layer[data-effect='galaxy']::after { content:'✦ · ✧ · 🌌 · ✦ · ☄️ · '; text-shadow:0 0 10px #c084fc; }
    .snow-layer[data-effect='newyear']::before,.snow-layer[data-effect='newyear']::after { content:'🎆 · ✨ · 🎇 · 🥳 · 🎉 · '; text-shadow:0 0 12px #fbbf24; }
    .snow-layer[data-effect='hearts']::before,.snow-layer[data-effect='hearts']::after { content:'💗 · 💖 · 💞 · ✨ · 💘 · '; text-shadow:0 0 10px #f472b6; }
    .snow-layer[data-effect='sakura']::before,.snow-layer[data-effect='sakura']::after { content:'🌸 · 🌸 · ✿ · 🌸 · ✨ · '; text-shadow:0 0 10px #f9a8d4; }
    .snow-layer[data-effect='spring']::before,.snow-layer[data-effect='spring']::after { content:'🌷 · 🌼 · 🍃 · 🦋 · 🌱 · '; text-shadow:0 0 10px #86efac; }
    .snow-layer[data-effect='forest']::before,.snow-layer[data-effect='forest']::after { content:'🍃 · 🌿 · ✨ · 🌳 · 🍀 · '; text-shadow:0 0 10px #4ade80; }
    .snow-layer[data-effect='ocean']::before,.snow-layer[data-effect='ocean']::after { content:'🌊 · 💧 · 🐬 · ✨ · 🫧 · '; text-shadow:0 0 10px #67e8f9; }
    .snow-layer[data-effect='flag']::before,.snow-layer[data-effect='flag']::after { content:'🇮🇩 · ✨ · 🇮🇩 · 🎉 · 🇮🇩 · '; text-shadow:0 0 10px #f87171; }
    .snow-layer[data-effect='warrior']::before,.snow-layer[data-effect='warrior']::after { content:'⚔️ · 🛡️ · ✦ · ⚔️ · 🏆 · '; text-shadow:0 0 10px #cbd5e1; }
    @keyframes snowFall { from { transform:translateY(-10vh); } to { transform:translateY(115vh); } }
    /* Lencana premium: OWNER, VERIFIED V, dan VIP */
    .badge-owner,.badge-v,.badge-vip { position:relative; isolation:isolate; overflow:hidden; vertical-align:middle; white-space:nowrap; }
    .badge-owner {
      display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:8px;
      color:#281500; font-family:'Orbitron',sans-serif; font-size:9px; font-weight:900; letter-spacing:.35px;
      border:1px solid #fff0a6;
      background:linear-gradient(115deg,#8a4b08 0%,#fbbf24 18%,#fff2a8 34%,#e99a12 52%,#fff0a6 70%,#a85b08 100%);
      background-size:220% 100%; text-shadow:0 1px 0 rgba(255,255,255,.45);
      box-shadow:0 0 7px #f59e0b99,0 0 16px #fbbf244d,inset 0 1px 2px #fff9;
      animation:ownerGoldSweep 3.2s ease-in-out infinite, ownerFloat 2.8s ease-in-out infinite;
    }
    .badge-owner::after,.badge-vip::after {
      content:''; position:absolute; z-index:-1; top:-60%; left:-45%; width:32%; height:220%;
      transform:rotate(25deg); background:linear-gradient(90deg,transparent,#ffffffb8,transparent);
      animation:badgeShine 3.6s ease-in-out infinite; pointer-events:none;
    }
    .badge-owner .badge-crown { font-size:12px; line-height:1; filter:drop-shadow(0 0 3px #fff4a8); }
    .badge-v { box-shadow:0 0 10px #22d3ee, 0 0 22px #0ea5e9; animation:vBadgePulse 2s ease-in-out infinite; }
    .badge-v::before { content:'✦'; position:absolute; left:-13px; top:0; color:#67e8f9; font-size:11px; text-shadow:0 0 7px #22d3ee; transform:rotate(-25deg); }
    .badge-v {
      display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%;
      color:white; font-family:Arial,sans-serif; font-size:12px; font-weight:1000; font-style:italic;
      border:1.5px solid #d9f5ff; outline:1px solid #0284c7; outline-offset:1px;
      background:radial-gradient(circle at 30% 22%,#a5f3fc 0%,#38bdf8 30%,#2563eb 72%,#172554 100%);
      text-shadow:0 1px 3px #082f49; box-shadow:0 0 7px #38bdf8,0 0 15px #0ea5e966;
      animation:verifiedPop 2.5s ease-in-out infinite;
    }
    .badge-v::after { content:'✓'; position:absolute; right:-3px; bottom:-3px; width:9px; height:9px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; color:#052e16; background:#86efac; border:1px solid #ecfdf5;
      font:900 7px Arial,sans-serif; box-shadow:0 0 5px #4ade80; }
    .badge-vip {
      display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:7px;
      color:#fff0a6; font-family:'Orbitron',sans-serif; font-size:9px; font-weight:900; letter-spacing:.7px;
      border:1px solid #fcd34d; background:linear-gradient(135deg,#422006,#92400e 42%,#451a03);
      box-shadow:0 0 7px #f59e0b80,inset 0 0 7px #fbbf2433;
      text-shadow:0 0 7px #fbbf24; animation:vipAura 2.2s ease-in-out infinite;
    }
    .badge-vip .badge-star { color:#fde68a; font-size:10px; filter:drop-shadow(0 0 4px #fbbf24); }
    .badge-admin { text-shadow:0 0 8px currentColor; box-shadow:0 0 10px rgba(34,211,238,.18); animation:badgePulse 2.8s ease-in-out infinite; }
    @keyframes badgePulse { 50% { filter:brightness(1.22); box-shadow:0 0 14px currentColor; } }
    @keyframes ownerGoldSweep { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
    @keyframes ownerFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-1.5px); } }
    @keyframes badgeShine { 0%,48% { left:-45%; opacity:0; } 58% { opacity:1; } 78%,100% { left:130%; opacity:0; } }
    @keyframes verifiedPop { 0%,100% { transform:scale(1); filter:brightness(1); } 50% { transform:scale(1.1); filter:brightness(1.25); } }
    @keyframes vipAura { 0%,100% { box-shadow:0 0 6px #f59e0b66,inset 0 0 6px #fbbf2422; } 50% { box-shadow:0 0 13px #fbbf2acc,0 0 21px #f59e0b55,inset 0 0 9px #fbbf2455; } }
    @keyframes vBadgePulse { 0%,100%{filter:drop-shadow(0 0 2px #22d3ee)} 50%{filter:drop-shadow(0 0 9px #22d3ee) drop-shadow(0 0 14px #3b82f6)} }
    @media (prefers-reduced-motion:reduce) { .badge-owner,.badge-owner::after,.badge-v,.badge-vip,.badge-vip::after { animation:none !important; } }
    .glass-card {
      background: var(--wop-card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--wop-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes neonShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes borderPulseGlow {
      0%, 100% {
        box-shadow: 0 0 14px rgba(251, 191, 36, 0.35), 0 0 28px rgba(6, 182, 212, 0.2), inset 0 0 12px rgba(251, 191, 36, 0.12);
        border-color: rgba(251, 191, 36, 0.65);
      }
      50% {
        box-shadow: 0 0 22px rgba(6, 182, 212, 0.55), 0 0 36px rgba(245, 158, 11, 0.35), inset 0 0 16px rgba(6, 182, 212, 0.2);
        border-color: rgba(34, 211, 238, 0.85);
      }
    }
    @keyframes hitShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-1deg); }
      40% { transform: translateX(6px) rotate(1deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    @keyframes floatDamage {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.85); }
      30% { opacity: 1; transform: translate(-50%, -18px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -44px) scale(0.95); }
    }
    @keyframes dragonBlast {
      0% { opacity: 0; transform: scale(0.5); }
      35% { opacity: 1; transform: scale(1.12); }
      100% { opacity: 0; transform: scale(1.35); }
    }
    @keyframes claimGlow {
      0%, 100% {
        box-shadow: 0 0 16px rgba(251, 191, 36, 0.7), 0 0 32px rgba(16, 185, 129, 0.45);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 26px rgba(251, 191, 36, 0.95), 0 0 42px rgba(6, 182, 212, 0.7);
        transform: scale(1.02);
      }
    }
    .animate-hit-shake { animation: hitShake 0.42s ease-in-out; }
    .animate-float-dmg { animation: floatDamage 1.05s ease-out forwards; }
    .animate-dragon-blast { animation: dragonBlast 0.9s ease-out forwards; }
    .animate-claim-btn { animation: claimGlow 1.6s ease-in-out infinite; }

    .credits-banner-glow {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 27, 75, 0.92), rgba(15, 23, 42, 0.96));
      animation: borderPulseGlow 3s ease-in-out infinite;
    }
    .owner-neon-text {
      background: linear-gradient(90deg, #fde047, #f59e0b, #fb7185, #fde047);
      background-size: 250% 250%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: neonShimmer 3s linear infinite;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.65));
    }
    .admin-neon-text {
      background: linear-gradient(90deg, #67e8f9, #38bdf8, #c084fc, #67e8f9);
      background-size: 250% 250%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: neonShimmer 3.5s linear infinite;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.65));
    }

    /* WAR OF POWER — efek pembuka spin, warna diatur Owner */
    .wop-spin-fx { position:fixed; inset:0; z-index:9998; display:grid; place-items:center; overflow:hidden; pointer-events:none; background:radial-gradient(circle,rgba(2,6,23,.25),transparent 60%); }
    .wop-spin-fx .fx-stage { position:relative; width:min(78vw,310px); height:min(78vw,310px); display:grid; place-items:center; }
    .wop-spin-fx .fx-core { position:relative; z-index:3; font-size:clamp(54px,17vw,92px); line-height:1; color:var(--fx-a); text-shadow:0 0 12px var(--fx-a),0 0 28px var(--fx-b),0 0 55px var(--fx-a); filter:drop-shadow(0 0 16px var(--fx-b)); }
    .wop-spin-fx .fx-ring { position:absolute; inset:16%; border:3px solid var(--fx-a); border-radius:50%; box-shadow:0 0 16px var(--fx-a),inset 0 0 18px var(--fx-b); opacity:0; }
    .wop-spin-fx .fx-ring.r2 { inset:3%; border-color:var(--fx-b); border-style:dashed; }
    .wop-spin-fx .fx-ring.r3 { inset:27%; border-width:2px; border-color:var(--fx-b); }
    .wop-spin-fx .fx-particle { position:absolute; width:11px; height:11px; border-radius:3px; background:var(--fx-a); box-shadow:0 0 12px var(--fx-a),0 0 24px var(--fx-b); opacity:0; }
    .wop-spin-fx .fx-particle.p1 { left:12%; top:22%; }
    .wop-spin-fx .fx-particle.p2 { right:12%; top:27%; background:var(--fx-b); }
    .wop-spin-fx .fx-particle.p3 { left:18%; bottom:18%; background:var(--fx-b); }
    .wop-spin-fx .fx-particle.p4 { right:18%; bottom:16%; }
    @keyframes wopFxFlash { 0%{opacity:0;transform:scale(.2) rotate(-35deg)} 18%{opacity:1;transform:scale(1.25) rotate(12deg)} 38%{transform:scale(.92) rotate(-8deg)} 100%{opacity:0;transform:scale(1.65) rotate(25deg)} }
    @keyframes wopFxRing { 0%{opacity:0;transform:scale(.25) rotate(0)} 25%{opacity:.95} 100%{opacity:0;transform:scale(1.5) rotate(170deg)} }
    @keyframes wopFxParticle { 0%{opacity:0;transform:translate(0,0) scale(.2)} 25%{opacity:1} 100%{opacity:0;transform:translate(var(--dx,70px),var(--dy,-80px)) scale(0)} }
    @keyframes wopFxSpin { 0%{opacity:0;transform:rotate(0) scale(.45)} 30%{opacity:1} 100%{opacity:0;transform:rotate(330deg) scale(1.5)} }
    @keyframes wopFxPulse { 0%,100%{transform:scale(.72);opacity:.3} 45%{transform:scale(1.13);opacity:1} }
    @keyframes wopFxShake { 0%,100%{transform:translateX(0) scale(1)} 20%{transform:translateX(-8px) scale(1.12)} 40%{transform:translateX(8px) scale(1.12)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
    .wop-spin-fx .fx-ring { animation:wopFxRing 1.05s ease-out forwards; }
    .wop-spin-fx .fx-ring.r2 { animation-delay:.06s; }
    .wop-spin-fx .fx-ring.r3 { animation-delay:.12s; }
    .wop-spin-fx .fx-particle { animation:wopFxParticle .85s ease-out forwards; }
    .wop-spin-fx .fx-particle.p1 { --dx:-95px; --dy:-110px; }
    .wop-spin-fx .fx-particle.p2 { --dx:100px; --dy:-95px; animation-delay:.04s; }
    .wop-spin-fx .fx-particle.p3 { --dx:-105px; --dy:90px; animation-delay:.08s; }
    .wop-spin-fx .fx-particle.p4 { --dx:100px; --dy:105px; animation-delay:.12s; }
    .wop-spin-fx-lightning .fx-core { animation:wopFxFlash .92s ease-out forwards; }
    .wop-spin-fx-fire .fx-core { animation:wopFxPulse .42s ease-in-out 2, wopFxFlash .9s .12s ease-out forwards; }
    .wop-spin-fx-ice .fx-core { animation:wopFxSpin 1s ease-out forwards; }
    .wop-spin-fx-portal .fx-core { animation:wopFxPulse .75s ease-in-out 1; }
    .wop-spin-fx-galaxy .fx-core { animation:wopFxSpin 1.15s ease-out forwards; }
    .wop-spin-fx-neon .fx-core { animation:wopFxShake .5s linear 2, wopFxFlash .9s .08s ease-out forwards; }
    .wop-spin-fx-dragon .fx-core { animation:wopFxFlash 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    .wop-spin-fx-crystal .fx-core { animation:wopFxSpin .95s ease-out forwards; }
    .wop-spin-fx-plasma .fx-core { animation:wopFxPulse .35s ease-in-out 3; }
    .wop-spin-fx-shockwave .fx-core { animation:wopFxShake .55s ease-out, wopFxFlash .9s .08s ease-out forwards; }
    @media (prefers-reduced-motion:reduce) { .wop-spin-fx .fx-core,.wop-spin-fx .fx-ring,.wop-spin-fx .fx-particle { animation-duration:.35s !important; } }

<body class="cyber-grid min-h-screen flex flex-col relative">

  <!-- DYNAMIC THEME BACKGROUND LAYER -->
  <div id="themeBgLayer" class="theme-bg-overlay"></div>
  <div id="snowLayer" class="snow-layer" aria-hidden="true"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastBox" class="fixed top-3 left-1/2 -translate-x-1/2 z-[120] hidden max-w-[92vw]">
    <div id="toastContent" class="px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl border backdrop-blur-md text-center"></div>

    function generateThemeArtworkDataUrl(themeKey, promptText = '') {
      const canvas = document.createElement('canvas');
      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext('2d');
      const p = (themeKey + ' ' + promptText).toLowerCase();

      let cTop = '#070b14', cMid = '#0f172a', cBot = '#1e293b', glow = '#38bdf8', accent = '#fbbf24';
      let mode = 'cyber';
      if (p.includes('tahun baru') || p.includes('new year') || p.includes('2027') || p.includes('kembang api') || p.includes('fireworks')) {
        cTop = '#080d2b'; cMid = '#24104b'; cBot = '#713f12'; glow = '#facc15'; accent = '#f0abfc'; mode = 'newyear';
      } else if (p.includes('halloween') || p.includes('labu') || p.includes('seram') || p.includes('hantu') || p.includes('pumpkin')) {
        cTop = '#0f0518'; cMid = '#240b36'; cBot = '#3b0d11'; glow = '#f97316'; accent = '#a855f7';
        mode = 'halloween';
      } else if (p.includes('naga') || p.includes('api') || p.includes('fire') || p.includes('lava') || p.includes('merah')) {
        cTop = '#180507'; cMid = '#450a0a'; cBot = '#7c2d12'; glow = '#ef4444'; accent = '#fbbf24';
        mode = 'fire';
      } else if (p.includes('es') || p.includes('salju') || p.includes('winter') || p.includes('ice') || p.includes('beku')) {
        cTop = '#041224'; cMid = '#0c4a6e'; cBot = '#164e63'; glow = '#67e8f9'; accent = '#e0f2fe';
        mode = 'winter';
      } else if (p.includes('ramadhan') || p.includes('lebaran') || p.includes('emas') || p.includes('sultan') || p.includes('gurun')) {
        cTop = '#051b14'; cMid = '#064e3b'; cBot = '#422006'; glow = '#10b981'; accent = '#fbbf24';
        mode = 'sultan';
      } else if (p.includes('hutan') || p.includes('alam') || p.includes('hijau') || p.includes('jungle')) {
        cTop = '#03150c'; cMid = '#064e3b'; cBot = '#14532d'; glow = '#34d399'; accent = '#a3e635';
        mode = 'forest';
      }

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, cTop);
      grad.addColorStop(0.55, cMid);
      grad.addColorStop(1, cBot);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Aura bulan / matahari / portal energi di langit
      const orbGrad = ctx.createRadialGradient(360, 290, 20, 360, 290, 260);
      orbGrad.addColorStop(0, glow);
      orbGrad.addColorStop(0.45, accent + '66');
      orbGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = orbGrad;
      ctx.beginPath();
      ctx.arc(360, 290, 260, 0, Math.PI * 2);
      ctx.fill();

      // Bintang & partikel bercahaya
      for (let i = 0; i < 95; i++) {
        const sx = (i * 173 + 41) % canvas.width;
        const sy = (i * 293 + 97) % 860;
        const sr = (i % 3) + 1.2;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.65)' : glow;
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }

      if (mode === 'halloween') {
        // Bulan purnama jingga besar
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.arc(360, 270, 115, 0, Math.PI * 2);
        ctx.fill();

        // Siluet Kastil Halloween & Pepohonan Angker
        ctx.fillStyle = '#09030f';
        ctx.beginPath();
        ctx.moveTo(0, 1280);
        ctx.lineTo(0, 860);
        ctx.lineTo(90, 820);
        ctx.lineTo(130, 680);
        ctx.lineTo(165, 620);
        ctx.lineTo(200, 680);
        ctx.lineTo(230, 790);
        ctx.lineTo(310, 760);
        ctx.lineTo(360, 560);
        ctx.lineTo(410, 760);
        ctx.lineTo(490, 790);
        ctx.lineTo(525, 650);
        ctx.lineTo(560, 595);
        ctx.lineTo(595, 650);
        ctx.lineTo(630, 830);
        ctx.lineTo(720, 870);
        ctx.lineTo(720, 1280);
        ctx.closePath();
        ctx.fill();

        // Jendela kastil menyala
        ctx.fillStyle = '#fde047';
        [158, 352, 552].forEach((wx, idx) => {
          ctx.fillRect(wx, 690 + idx * 12, 16, 28);
        });

        // Kelelawar terbang
        ctx.strokeStyle = '#09030f';
        ctx.lineWidth = 4;
        [[210, 230], [490, 200], [540, 310], [160, 340]].forEach(([bx, by]) => {
          ctx.beginPath();
          ctx.moveTo(bx - 22, by);
          ctx.quadraticCurveTo(bx - 10, by - 14, bx, by);
          ctx.quadraticCurveTo(bx + 10, by - 14, bx + 22, by);
          ctx.stroke();
        });

        // Jack-O-Lantern Labu Menyala di bawah
        const drawPumpkin = (px, py, r) => {
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.ellipse(px, py, r * 1.15, r * 0.9, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#7c2d12';
          ctx.lineWidth = 3;
          ctx.stroke();
          // Mata & mulut menyala
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.moveTo(px - r * 0.45, py - r * 0.15);
          ctx.lineTo(px - r * 0.2, py - r * 0.35);
          ctx.lineTo(px - r * 0.1, py - r * 0.1);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(px + r * 0.45, py - r * 0.15);
          ctx.lineTo(px + r * 0.2, py - r * 0.35);
          ctx.lineTo(px + r * 0.1, py - r * 0.1);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(px, py + r * 0.15, r * 0.45, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.fill();
        };
        drawPumpkin(165, 1080, 56);
        drawPumpkin(555, 1090, 62);
      } else if (mode === 'fire') {
        // Gunung berapi & pilar api naga
        ctx.fillStyle = '#1c0608';
        ctx.beginPath();
        ctx.moveTo(0, 1280);
        ctx.lineTo(0, 920);
        ctx.lineTo(250, 680);
        ctx.lineTo(360, 740);
        ctx.lineTo(480, 660);
        ctx.lineTo(720, 930);
        ctx.lineTo(720, 1280);
        ctx.closePath();
        ctx.fill();

        // Aliran lava menyala
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(310, 720);
        ctx.quadraticCurveTo(280, 920, 210, 1180);
        ctx.moveTo(430, 700);
        ctx.quadraticCurveTo(470, 910, 520, 1180);
        ctx.stroke();
      } else if (mode === 'winter') {
        // Pegunungan Kristal Es & Salju
        ctx.fillStyle = '#082f49';
        ctx.beginPath();
        ctx.moveTo(0, 1280);
        ctx.lineTo(0, 880);
        ctx.lineTo(190, 640);
        ctx.lineTo(360, 810);
        ctx.lineTo(540, 610);
        ctx.lineTo(720, 870);
        ctx.lineTo(720, 1280);
        ctx.closePath();
        ctx.fill();

        // Puncak es bersinar
        ctx.fillStyle = 'rgba(224,242,254,0.45)';
        ctx.beginPath();
        ctx.moveTo(190, 640); ctx.lineTo(130, 730); ctx.lineTo(240, 725); ctx.closePath();
        ctx.moveTo(540, 610); ctx.lineTo(480, 710); ctx.lineTo(600, 705); ctx.closePath();
        ctx.fill();
      } else if (mode === 'sultan') {
        // Kubah istana emas & bulan sabit
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(360, 250, 75, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = cTop;
        ctx.beginPath();
        ctx.arc(388, 232, 65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#042f2e';
        ctx.beginPath();
        ctx.moveTo(0, 1280);
        ctx.lineTo(0, 900);
        ctx.quadraticCurveTo(180, 780, 360, 900);
        ctx.quadraticCurveTo(540, 780, 720, 900);
        ctx.lineTo(720, 1280);
        ctx.closePath();
        ctx.fill();
      } else {
        // Grid Perspektif Arena Cyber
        ctx.strokeStyle = glow + '33';
        ctx.lineWidth = 2;
        for (let y = 760; y <= 1280; y += 45) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(720, y);
          ctx.stroke();
        }
        for (let x = -360; x <= 1080; x += 90) {
          ctx.beginPath();
          ctx.moveTo(360, 760);
          ctx.lineTo(x, 1280);
          ctx.stroke();
        }
      }

      return {
        dataUrl: canvas.toDataURL('image/jpeg', 0.86),
        bgColor: cTop,
        cardBg: mode === 'halloween' ? 'rgba(26, 11, 38, 0.88)' : mode === 'fire' ? 'rgba(34, 10, 14, 0.88)' : mode === 'winter' ? 'rgba(8, 32, 54, 0.88)' : mode === 'sultan' ? 'rgba(6, 40, 32, 0.88)' : 'rgba(15, 23, 42, 0.88)',
        borderColor: glow + '55',
        glow1: glow + '2b',
        glow2: accent + '26'
      };
    }

    function generateItemArtworkDataUrl(promptText = '', category = 'HERO') {
      const canvas = document.createElement('canvas');
      canvas.width = 280;
      canvas.height = 280;
      const ctx = canvas.getContext('2d');
      const p = (promptText + ' ' + category).toLowerCase();

      let c1 = '#0284c7', c2 = '#1e3a8a', ring = '#38bdf8', icon = '⚔️';
      if (p.includes('halloween') || p.includes('labu') || p.includes('pumpkin') || p.includes('seram')) {
        c1 = '#ea580c'; c2 = '#3b0764'; ring = '#fb923c'; icon = '🎃';
      } else if (p.includes('naga') || p.includes('dragon') || p.includes('api') || p.includes('fire')) {
        c1 = '#dc2626'; c2 = '#7c2d12'; ring = '#fbbf24'; icon = '🐉';
      } else if (p.includes('es') || p.includes('ice') || p.includes('kristal') || p.includes('biru')) {
        c1 = '#06b6d4'; c2 = '#0f172a'; ring = '#67e8f9'; icon = '❄️';
      } else if (p.includes('petir') || p.includes('halilintar') || p.includes('emas') || p.includes('raja') || p.includes('pangeran')) {
        c1 = '#d97706'; c2 = '#451a03'; ring = '#fde047'; icon = '👑';
      } else if (p.includes('perisai') || p.includes('shield') || p.includes('tameng')) {
        c1 = '#0891b2'; c2 = '#1e293b'; ring = '#22d3ee'; icon = '🔰';
      } else if (p.includes('medkit') || p.includes('obat') || p.includes('heal') || p.includes('elixir')) {
        c1 = '#059669'; c2 = '#064e3b'; ring = '#34d399'; icon = '💊';
      } else if (p.includes('pedang') || p.includes('sword')) {
        c1 = '#7c3aed'; c2 = '#1e1b4b'; ring = '#c084fc'; icon = '🗡️';
      }

      const bgGrad = ctx.createLinearGradient(0, 0, 280, 280);
      bgGrad.addColorStop(0, c1);
      bgGrad.addColorStop(1, c2);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 280, 280);

      // Aura lingkaran energi
      const aura = ctx.createRadialGradient(140, 130, 15, 140, 130, 125);
      aura.addColorStop(0, 'rgba(255,255,255,0.35)');
      aura.addColorStop(0.6, ring + '55');
      aura.addColorStop(1, 'transparent');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(140, 130, 125, 0, Math.PI * 2);
      ctx.fill();

      // Bingkai geometris
      ctx.strokeStyle = ring;
      ctx.lineWidth = 6;
      ctx.strokeRect(14, 14, 252, 252);

      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(140, 125, 76, 0, Math.PI * 2);
      ctx.stroke();

      // Partikel kilau
      for (let i = 0; i < 18; i++) {
        const px = 30 + ((i * 53) % 220);
        const py = 30 + ((i * 79) % 220);
        ctx.fillStyle = i % 2 === 0 ? '#ffffff' : ring;
        ctx.beginPath();
        ctx.arc(px, py, (i % 3) + 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ikon utama besar di tengah
      ctx.font = '84px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(icon, 140, 122);

      // Label nama item di bawah
      const shortTitle = (promptText || category).toUpperCase().slice(0, 18);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(24, 212, 232, 36);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 15px Orbitron, Arial, sans-serif';
      ctx.fillText(shortTitle, 140, 231);

      return canvas.toDataURL('image/png');
    }

    function updateWopThemeAppIcon(theme, effect) {
      try {
        const emoji = effect === 'newyear' ? '🎆' : effect === 'christmas' ? '🎅' : effect === 'winter' ? '❄️' : effect === 'halloween' ? '🎃' : effect === 'fire' ? '🐉' : effect === 'galaxy' ? '🌌' : '⚔️';
        const c1 = theme.color1 || theme.bgColor || '#0e7490';
        const c2 = theme.color2 || '#111827';
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><circle cx="256" cy="230" r="166" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="12"/><text x="256" y="280" font-size="190" text-anchor="middle">${emoji}</text><text x="256" y="430" font-family="Arial" font-size="54" font-weight="900" text-anchor="middle" fill="#fff">WOP</text></svg>`;
        const data = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        let icon = document.querySelector('link[rel="icon"]');

      if (!oldDateStr || !newDateStr) return 0;
      const a = new Date(oldDateStr + 'T00:00:00');

      return Math.round((b - a) / (1000 * 60 * 60 * 24));

      if (!user) return;

      const addStarterItems = options.addStarterItems !== false;
      user.inventory = (Array.isArray(user.inventory) ? user.inventory : []).filter(item => {
        // Item TRIAL otomatis dikeluarkan dari inventory setelah masa kepemilikannya habis.
        return !(item && item.expiresAt && Number.isFinite(new Date(item.expiresAt).getTime()) && new Date(item.expiresAt).getTime() <= Date.now());
      }).map((item, index) => {
        const migrated = migrateLegacyItem(item) || {};
        // Profil yang dibaca dari Cloud tidak boleh diberi UID acak lokal karena
        // UID tersebut tidak tersimpan di Firestore dan dapat membuat baris UI
        // berbeda identitas dari item aslinya.
        if (assignItemUids && !migrated.uid) {
          migrated.uid = `legacy_${String(user.id || 'player')}_${Date.now()}_${index}_${Math.random().toString(36).slice(2,7)}`;

          const unreadGroup = (state.config.groups || []).some((group) => (group.unreadFor || []).includes(ownChatEmail));
          document.getElementById('friendUnreadDot')?.classList.toggle('hidden', !(unreadDirect || unreadGroup));
          scheduleRender();
        }, (error) => console.warn('Daftar chat tidak dapat dimuat:', error?.code || error)));
        const applyProfileSnapshot = (docSnap) => {
          if (!docSnap || !docSnap.exists()) return;
          const data = docSnap.data();
          if (!data || !data.email) return;
          const em = String(data.email).toLowerCase();
          // Abaikan snapshot profil lama milik akun sendiri selama spin berlangsung.
          // Snapshot lama tidak boleh menimpa saldo Diamond yang sedang dikurangi secara lokal.
          if (isSpinning && em === String(firebaseUser.email || '').toLowerCase()) return;
          if (!isStaffAuth() && em !== String(firebaseUser.email || '').toLowerCase()) return;
          const officialUid = OFFICIAL_UID_BY_EMAIL[em];
          if (em === String(firebaseUser.email || '').toLowerCase() && data.uid && data.uid !== firebaseUser.uid) return;
          if (officialUid && data.uid && data.uid !== officialUid) return;
          if (officialUid && em === String(firebaseUser.email || '').toLowerCase() && firebaseUser.uid !== officialUid) return;
          state.users[em] = { ...(state.users[em] || {}), ...data, email: em };
          if (em === String(firebaseUser.email || '').toLowerCase()) state.users[em].uid = firebaseUser.uid;
          delete state.users[em].password;
          ensureUserAccountIntegrity(state.users[em], { assignItemUids: false, addStarterItems: false });
          // Saat OWNER/ADMIN memuat profil lama, buat entri direktori publik yang aman satu kali.
          if (isStaffAuth() && !publishedPublicEmails.has(em)) {
            publishedPublicEmails.add(em);
            const publicRecord = makePublicPlayerRecord(state.users[em], em);
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_public_players', em), publicRecord, { merge: true })
              .catch((err) => { publishedPublicEmails.delete(em); console.warn('Migrasi direktori pemain gagal:', err?.code || err); });
          }
          persistLocal();
          if (activeChatFriendId) renderFullscreenFriendChat();
          scheduleRender();
        };
        if (isStaffAuth()) {
          cloudUnsubscribers.push(onSnapshot(playersCollection, (snap) => {
            snap.forEach((docSnap) => applyProfileSnapshot(docSnap));
          }, (error) => console.warn('Akses daftar pemain ditolak:', error?.code || error)));
        } else {
          const ownEmail = String(firebaseUser.email || '').toLowerCase();
          cloudUnsubscribers.push(onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', ownEmail), applyProfileSnapshot, (error) => console.warn('Akses profil sendiri ditolak:', error?.code || error)));
        }

        // Grup disimpan terpisah; pemain hanya mendengarkan grup yang diikutinya.
        const groupsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'wop_groups');
        const groupsQuery = isStaffAuth() ? groupsCollection : query(groupsCollection, where('members', 'array-contains', ownChatEmail));
        cloudUnsubscribers.push(onSnapshot(groupsQuery, (snap) => {
          const liveIds = new Set();
          const previous = new Map((state.config.groups || []).map((g) => [g.id, g]));
          snap.forEach((groupDoc) => {
            const raw = groupDoc.data() || {};
            const groupId = groupDoc.id;
            liveIds.add(groupId);
            const current = { ...raw, id: groupId, messages: previous.get(groupId)?.messages || [] };
            const at = (state.config.groups || []).findIndex((g) => g.id === groupId);
            if (at >= 0) state.config.groups[at] = current;
            else state.config.groups.push(current);
            if (!groupMessageUnsubscribers.has(groupId)) {
              const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'wop_groups', groupId, 'messages');
              const stop = onSnapshot(messagesRef, (messageSnap) => {
                const target = (state.config.groups || []).find((g) => g.id === groupId);
                if (!target) return;
                target.messages = messageSnap.docs.map((d) => ({ id: d.id, ...d.data() }))
                  .sort((a, b) => Number(a.createdAt || 0) - Number(b.createdAt || 0));
                persistLocal();
                scheduleRender();
              }, (error) => console.warn('Pesan grup tidak dapat dimuat:', error?.code || error));
              groupMessageUnsubscribers.set(groupId, stop);
            }
          });
          state.config.groups = (state.config.groups || []).filter((g) => liveIds.has(g.id));
          for (const [groupId, stop] of groupMessageUnsubscribers.entries()) {
            if (!liveIds.has(groupId)) { try { stop(); } catch (e) {} groupMessageUnsubscribers.delete(groupId); }
          }
          persistLocal();
          const unreadGroup = (state.config.groups || []).some((group) => (group.unreadFor || []).includes(ownChatEmail));
          const unreadDirect = Object.values(state.directChats || {}).some((chat) => (chat.unreadFor || []).includes(ownChatEmail));
          document.getElementById('friendUnreadDot')?.classList.toggle('hidden', !(unreadGroup || unreadDirect));
          scheduleRender();
        }, (error) => console.warn('Daftar grup tidak dapat dimuat:', error?.code || error)));

        if (isOwnerAuth()) {
          cloudUnsubscribers.push(onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'wop_topups'), (snap) => {
            state.config.pendingTopups = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
            state.config.pendingTopups.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
            persistLocal();
            scheduleRender();
          }, (error) => console.warn('Akses pesanan top up OWNER ditolak:', error?.code || error)));
        } else {
          state.config.pendingTopups = [];
        }

        const mediaGalleryCollection = collection(db, 'artifacts', appId, 'public', 'data', 'wop_media_gallery');
        cloudUnsubscribers.push(onSnapshot(mediaGalleryCollection, (snap) => {
          state.mediaGallery = snap.docs.map((d) => ({ ...d.data(), id: d.id })).filter((item) => typeof item.imageData === 'string' && item.imageData.startsWith('data:image/'));
          scheduleRender();
        }, (error) => {
          console.warn('Galeri media cloud belum dapat dibaca. Periksa izin Firestore wop_media_gallery:', error?.code || error);
        }));

        cloudUnsubscribers.push(onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'wop_global', 'config'), (docSnap) => {
          if (docSnap.exists()) {
            const incoming = docSnap.data();
            state.config = {
              ...state.config,
              ...incoming,
              socialLinks: {
                ...state.config.socialLinks,
                ...(incoming.socialLinks || {})
              },
              groupModeration: {
                ...state.config.groupModeration,
                ...(incoming.groupModeration || {})
              },
              groups: state.config.groups || []
            };
            const compareWopVersions = (left, right) => {
              const a = String(left || '0').match(/\d+/g)?.map(Number) || [0];
              const b = String(right || '0').match(/\d+/g)?.map(Number) || [0];
              for (let i = 0; i < Math.max(a.length, b.length); i++) { const diff = (a[i] || 0) - (b[i] || 0); if (diff) return diff; }
              return 0;
            };
            if (compareWopVersions(state.config.websiteVersion, 'v2.18.6') < 0) {
              state.config.websiteVersion = 'v2.18.6';
              state.config.websiteVersionNote = 'v2.18.6 — Draft formulir kode Redeem tidak hilang saat data Firebase diperbarui.';
              if (isOwnerAuth()) setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_global', 'config'), { websiteVersion: state.config.websiteVersion, websiteVersionNote: state.config.websiteVersionNote }, { merge: true }).catch((versionError) => console.warn('Versi website belum tersimpan:', versionError?.code || versionError));
            }
            if (isOwnerAuth() && Array.isArray(incoming.groups) && incoming.groups.length && !legacyGroupsMigrationDone && !legacyGroupsMigrationPromise) {
              legacyGroupsMigrationPromise = migrateLegacyGroupsToPrivate(incoming.groups)
                .catch((err) => console.warn('Migrasi grup lama gagal:', err?.code || err))
                .finally(() => { legacyGroupsMigrationPromise = null; });
            }
            ensureConfigIntegrity();
            applyWebsiteThemeToDOM();
            persistLocal();
            scheduleRender();
          }
        }, () => {}));
      } catch (e) {}
    }

    function groupDocumentRef(groupId) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'wop_groups', String(groupId));
    }
    function groupMessageCollectionRef(groupId) {
      return collection(db, 'artifacts', appId, 'public', 'data', 'wop_groups', String(groupId), 'messages');
    }
    function groupMessageDocumentRef(groupId, messageId) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'wop_groups', String(groupId), 'messages', String(messageId));
    }
    function groupInviteDocumentRef(inviteCode) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'wop_group_invites', String(inviteCode).toUpperCase());
    }
    function makeCloudGroupRecord(group) {
      return {
        id: String(group.id), name: String(group.name || '').slice(0, 60),
        desc: String(group.desc || '').slice(0, 500), avatar: String(group.avatar || ''),
        inviteCode: String(group.inviteCode || '').toUpperCase(),
        creatorEmail: String(group.creatorEmail || '').toLowerCase(),
        admins: Array.isArray(group.admins) ? group.admins.map((x) => String(x).toLowerCase()) : [],
        members: Array.isArray(group.members) ? group.members.map((x) => String(x).toLowerCase()) : [],
        kickedMembers: Array.isArray(group.kickedMembers) ? group.kickedMembers.map((x) => String(x).toLowerCase()) : [],
        unreadFor: Array.isArray(group.unreadFor) ? group.unreadFor.map((x) => String(x).toLowerCase()) : [],
        createdAt: group.createdAt || new Date().toISOString()
      };
    }
    async function saveGroupMetadata(group, creating = false) {
      if (!db || !state.cloudReady || !firebaseUser) throw new Error('Koneksi Firebase belum siap.');
      const record = makeCloudGroupRecord(group);
      if (creating) {
        await setDoc(groupDocumentRef(group.id), record);
        await setDoc(groupInviteDocumentRef(record.inviteCode), { groupId: record.id, inviteCode: record.inviteCode });
      } else {
        const { id, unreadFor, ...changes } = record;
        await setDoc(groupDocumentRef(group.id), changes, { merge: true });
      }
      return true;
    }
    async function saveGroupMessage(group, message) {
      const user = getCurrentUser();
      if (!user || !db || !state.cloudReady || !firebaseUser) throw new Error('Koneksi chat grup belum siap.');
      const stored = {
        ...message,
        id: String(message.id || ('gmsg_' + Date.now())),
        senderEmail: String(user.email || '').toLowerCase(),
        senderName: String(message.senderName || user.username || 'PEMAIN').slice(0, 50),
        text: String(message.text || '').slice(0, 2000),
        createdAt: Number(message.createdAt || Date.now()),
        time: message.time || new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      };
      await setDoc(groupMessageDocumentRef(group.id, stored.id), stored);
      const recipients = (group.members || []).map((email) => String(email).toLowerCase()).filter((email) => email && email !== String(user.email).toLowerCase());
      const activity = {
        lastMessage: { type: stored.type, text: stored.type === 'sticker' ? '🎭 Mengirim Stiker' : String(stored.text || stored.question || '').slice(0, 180) },
        lastAt: stored.createdAt,
        lastSenderEmail: String(user.email).toLowerCase()
      };
      if (recipients.length) activity.unreadFor = arrayUnion(...recipients);
      await updateDoc(groupDocumentRef(group.id), activity);
      return stored;
    }
    async function migrateLegacyGroupsToPrivate(legacyGroups) {
      if (!isOwnerAuth() || !db || !state.cloudReady) return;
      for (const legacy of (legacyGroups || [])) {
        if (!legacy || !legacy.id || !legacy.inviteCode) continue;
        const record = makeCloudGroupRecord(legacy);
        await setDoc(groupDocumentRef(record.id), record, { merge: true });
        await setDoc(groupInviteDocumentRef(record.inviteCode), { groupId: record.id, inviteCode: record.inviteCode });
        for (const oldMessage of (legacy.messages || [])) {
          const messageId = String(oldMessage.id || ('legacy_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)));
          const stored = { ...oldMessage, id: messageId, senderEmail: String(oldMessage.senderEmail || firebaseUser.email).toLowerCase(), createdAt: Number(oldMessage.createdAt || Date.now()) };
          await setDoc(groupMessageDocumentRef(record.id, messageId), stored, { merge: true });
        }
      }
      const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_global', 'config');
      await updateDoc(configRef, { groups: deleteField() });
      legacyGroupsMigrationDone = true;
      persistLocal();
      showToast('Migrasi grup dan riwayat chat selesai.', 'success');
    }

    function makePublicPlayerRecord(user, emailOverride = '') {
      const userEmail = String(emailOverride || user?.email || '').toLowerCase();
      return {
        email: userEmail,
        uid: user?.uid || (userEmail === String(firebaseUser?.email || '').toLowerCase() ? firebaseUser?.uid : ''),
        id: String(user?.id || ''),
        username: String(user?.username || '').slice(0, 40),
        badges: { owner: Boolean(user?.badges?.owner), admin: Boolean(user?.badges?.admin), v: Boolean(user?.badges?.v), vip: Boolean(user?.badges?.vip) },
        level: Number(user?.level || 1),
        rank: String(user?.rank || 'Bronze'),
        likes: Number(user?.likes || 0),
        isOnline: Boolean(user?.isOnline),
        lastActive: Number(user?.lastActive || 0),
        avatar: String(user?.avatar || '')
      };
    }

    function cloneWopRecord(value) {
      try { return structuredClone(value); }
      catch (_) { return JSON.parse(JSON.stringify(value)); }
    }

    function restoreWopRecord(target, snapshot) {
      if (!target || !snapshot) return;
      for (const key of Object.keys(target)) delete target[key];
      Object.assign(target, cloneWopRecord(snapshot));
    }

    async function saveUsersAtomically(users) {
      if (!Array.isArray(users) || !users.length || !db || !state.cloudReady || !firebaseUser) return false;
      try {
        const batch = writeBatch(db);
        for (const user of users) {
          if (!user || !user.email) throw new Error('Data akun tidak lengkap.');
          const email = String(user.email).toLowerCase();
          const cloudUser = { ...user, email, password: deleteField(), accountCode: deleteField() };
          const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', email);
          const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_public_players', email);
          batch.set(playerRef, cloudUser, { merge: true });
          batch.set(publicRef, makePublicPlayerRecord(user, email), { merge: true });
        }
        await batch.commit();
        for (const user of users) {
          const email = String(user.email).toLowerCase();
          if (firebaseUser && email === String(firebaseUser.email || '').toLowerCase()) user.uid = firebaseUser.uid;
          state.users[email] = user;
        }
        persistLocal();
        return true;
      } catch (e) {
        console.warn('Transaksi Give ditolak Firestore:', e?.code || e);
        return false;
      }
    }

    async function saveUser(user) {
      state.lastSaveUserError = '';
      if (!user || !user.email) { state.lastSaveUserError = 'invalid-user'; return false; }
      delete user.password;
      const userEmail = String(user.email).toLowerCase();
      if (firebaseUser && userEmail === String(firebaseUser.email || '').toLowerCase()) user.uid = firebaseUser.uid;
      else if (!user.uid && OFFICIAL_UID_BY_EMAIL[userEmail]) user.uid = OFFICIAL_UID_BY_EMAIL[userEmail];
      state.users[userEmail] = user;
      persistLocal();
      if (db && state.cloudReady && firebaseUser) {
        try {
          const cloudUser = { ...user, email: userEmail, password: deleteField(), accountCode: deleteField() };
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', userEmail), cloudUser, { merge: true });
          const publicProfile = makePublicPlayerRecord(user, userEmail);
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_public_players', userEmail), publicProfile, { merge: true });
          return true;
        } catch (e) {
          state.lastSaveUserError = e?.code || e?.message || 'firestore-write-failed';
          console.warn('Penyimpanan profil ditolak Firestore:', e?.code || e);
          return false;
        }
      }
      state.lastSaveUserError = 'cloud-not-ready';
      return false;
    }

    async function saveSpinResultToCloud(user) {
      if (!user || !user.email) throw new Error('Profil pemain tidak lengkap.');
      if (!db || !state.cloudReady || !firebaseUser) throw new Error('Koneksi Firebase belum siap.');
      const email = String(user.email).toLowerCase();
      if (email !== String(firebaseUser.email || '').toLowerCase()) throw new Error('Akun Firebase aktif tidak cocok dengan profil spin.');

      const playerRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', email);
      const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_public_players', email);
      let stage = 'membaca profil pemain';
      try {
        const playerSnap = await getDoc(playerRef);
        if (!playerSnap.exists()) throw new Error('Dokumen profil cloud tidak ditemukan. Login ulang agar profil dimuat.');
        const cloudProfile = playerSnap.data() || {};
        if (String(cloudProfile.email || '').toLowerCase() !== email) throw new Error('Email dokumen profil cloud tidak cocok.');
        if (cloudProfile.uid !== firebaseUser.uid) throw new Error('UID profil cloud tidak cocok atau belum tertaut dengan akun login. Periksa UID akun di Firebase Authentication dan dokumen wop_players.');

        // Simpan hasil spin ke dokumen privat terlebih dahulu. Jangan gabungkan
        // update direktori publik dalam batch yang sama: kegagalan izin pada
        // direktori publik tidak boleh membatalkan penyimpanan Diamond/item.
        stage = 'menyimpan Diamond dan inventory ke wop_players';
        await updateDoc(playerRef, {
          diamond: Math.max(0, Number(user.diamond || 0)),
          inventory: Array.isArray(user.inventory) ? user.inventory : [],
          stats: user.stats || {},
          level: Math.max(1, Number(user.level || 1))
        });
        persistLocal();

        // Sinkronisasi direktori publik hanya tambahan. Jika Rules publik belum
        // mengizinkannya atau dokumen belum tersedia, hasil spin tetap berhasil
        // tersimpan di profil privat dan proses spin tidak di-rollback.
        try {
          stage = 'menyinkronkan direktori publik';
          const publicSnap = await getDoc(publicRef);
          if (publicSnap.exists()) {
            await updateDoc(publicRef, {
              level: Math.max(1, Number(user.level || 1)),
              rank: String(user.rank || 'Bronze'),
              username: String(user.username || 'PEMAIN').slice(0, 40),
              likes: Number(user.likes || 0),
              isOnline: Boolean(user.isOnline),
              lastActive: Number(user.lastActive || 0),
              avatar: String(user.avatar || '')
            });
          }
        } catch (publicError) {
          console.warn('Spin tersimpan, tetapi direktori publik belum tersinkron:', publicError?.code || publicError);
        }
        return true;
      } catch (error) {
        const wrapped = new Error(`${stage}: ${error?.message || error}`);
        wrapped.code = error?.code || 'spin-save-failed';
        wrapped.cause = error;
        throw wrapped;
      }
    }

    async function deleteCloudUserDoc(oldEmail) {

      if (db && state.cloudReady && firebaseUser) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', oldEmail));
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_public_players', oldEmail));
        } catch (e) {}
      }
    }

    async function migrateLegacyTopupsToPrivate() {
      if (!isOwnerAuth() || !db || !state.cloudReady) return;
      const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_global', 'config');
      const configSnap = await getDoc(configRef);
      const cloudRequests = configSnap.exists() && Array.isArray(configSnap.data().pendingTopups) ? configSnap.data().pendingTopups : [];
      const localRequests = Array.isArray(state.config.pendingTopups) ? state.config.pendingTopups : [];
      const merged = new Map();
      [...cloudRequests, ...localRequests].forEach((request, index) => {
        if (!request) return;
        const id = String(request.id || `legacy_topup_${index}_${Date.now()}`);
        merged.set(id, { ...request, id });
      });
      for (const [id, request] of merged.entries()) {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_topups', id), request, { merge: true });
      }
      if (configSnap.exists()) {
        await setDoc(configRef, { pendingTopups: deleteField() }, { merge: true });
      }
    }

    window.syncAllUsersFromCloud = async function(silent = false) {
      if (db && state.cloudReady && firebaseUser) {
        try {
          if (isStaffAuth()) {
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'wop_players'));
            snap.forEach((d) => {
              const data = d.data();
              if (!data || !data.email) return;
              const normalizedEmail = String(data.email).toLowerCase().replace(/@gacha\.com$/i, '@wop.com');
              const officialUid = OFFICIAL_UID_BY_EMAIL[normalizedEmail];
              if (officialUid && data.uid && data.uid !== officialUid) return;
              state.users[normalizedEmail] = { ...(state.users[normalizedEmail] || {}), ...data, email: normalizedEmail };
              if (officialUid && !state.users[normalizedEmail].uid) state.users[normalizedEmail].uid = officialUid;
              delete state.users[normalizedEmail].password;
              ensureUserAccountIntegrity(state.users[normalizedEmail], { assignItemUids: false, addStarterItems: false });
            });
          } else {
            const ownEmail = String(firebaseUser.email || '').toLowerCase();
            const ownRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', ownEmail);
            const ownSnap = await getDoc(ownRef);
            if (ownSnap.exists()) {
              const data = ownSnap.data();
              if (data && String(data.email || '').toLowerCase() === ownEmail) {
                if (data.uid && data.uid !== firebaseUser.uid) throw new Error('UID profil tidak cocok dengan akun Firebase.');
                state.users[ownEmail] = { ...(state.users[ownEmail] || {}), ...data, email: ownEmail, uid: firebaseUser.uid };
                delete state.users[ownEmail].password;
                ensureUserAccountIntegrity(state.users[ownEmail]);
              }
            }
          }
          persistLocal();
        } catch (e) { if (!silent) showToast('Sinkronisasi gagal atau akses Firestore ditolak. Periksa Firestore Rules.', 'error'); }
      }
      if (!silent) showToast('Data yang boleh diakses akun ini selesai disinkronkan.', 'success');
      scheduleRender();
    };

    async function updatePresence(onlineState) {
      const user = getCurrentUser();
      if (!user) return;
      user.isOnline = onlineState;
      user.lastActive = onlineState ? Date.now() : 0;
      await saveUser(user);
    }

        updatePresence(true);

      if (document.visibilityState === 'visible') updatePresence(true);

    window.addEventListener('beforeunload', () => {

    function extractNumericWopId(idStr) {
      const m = String(idStr || '').match(/(\d+)/);
      return m ? parseInt(m[1], 10) : 0;

    function generateRandomPlayerId() {
      const existingIds = new Set(Object.values(state.users || {}).map(u => String(u?.id || '').toUpperCase()));
      let candidate = '';
      // ID acak 4 digit; ulangi sampai unik terhadap semua profil yang saat ini diketahui aplikasi.
      for (let attempt = 0; attempt < 5000; attempt++) {
        const n = Math.floor(1000 + Math.random() * 9000);
        candidate = `WOP-${n}`;
        if (!existingIds.has(candidate)) return candidate;
      }
      // Fallback jika ruang ID acak hampir penuh.
      do {
        candidate = `WOP-${Math.floor(100000 + Math.random() * 900000)}`;
      } while (existingIds.has(candidate));
      return candidate;
    }

    function compareUsersByIdAsc(a, b) {
      const numA = extractNumericWopId(a && a.id);
      const numB = extractNumericWopId(b && b.id);
      if (numA !== numB) return numA - numB;
      return String(a?.id || '').localeCompare(String(b?.id || ''));
    }

    function findUserByQuery(query) {
      const q = String(query || '').trim().toLowerCase();
      if (!q) return null;
      const numericOnly = q.replace(/^wop-/, '');
      const all = Object.values(state.users);
      return (
        all.find((u) => u.id && u.id.toLowerCase() === q) ||
        all.find((u) => u.id && u.id.toLowerCase().replace(/^wop-/, '') === numericOnly) ||
        all.find((u) => u.username && u.username.toLowerCase() === q) ||
        all.find((u) => u.username && u.username.toLowerCase().includes(q)) ||
        null
      );
    }

    function playBeep(freq = 520, duration = 0.06) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function compressImageFile(file, callback, maxSide = 1800, quality = 0.93) {
      // Pertahankan resolusi tinggi; jangan mengecilkan banner menjadi thumbnail.
      const reader = new FileReader();
      reader.onerror = () => showToast('Gambar gagal dibaca. Coba pilih file lain.', 'error');
      reader.onload = (ev) => {
        const img = new Image();
        img.onerror = () => showToast('Format gambar tidak dapat dibuka.', 'error');
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
          const w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
          const h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d', { alpha: false });
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          // JPEG berkualitas tinggi untuk ukuran penyimpanan yang lebih terkendali.
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function detectProfanity(text) {
      const raw = String(text || '').toLowerCase();
      if (!raw.trim()) return null;
      const normalized = raw
        .replace(/0/g, 'o')
        .replace(/1/g, 'i')
        .replace(/3/g, 'e')
        .replace(/4/g, 'a')
        .replace(/5/g, 's')
        .replace(/7/g, 't')
        .replace(/@/g, 'a')
        .replace(/\$/g, 's')
        .replace(/[^a-z0-9\s]/g, ' ');

      const compact = normalized.replace(/\s+/g, '');
      const words = normalized.split(/\s+/).filter(Boolean);
      const badList = (state.config.groupModeration && state.config.groupModeration.badWords) || DEFAULT_BAD_WORDS;

      for (const bad of badList) {
        const cleanBad = String(bad || '').trim().toLowerCase();
        if (!cleanBad) continue;
        if (words.includes(cleanBad)) return cleanBad;
        if (cleanBad.length >= 4 && compact.includes(cleanBad)) return cleanBad;
      }
      return null;
    }

    function checkDailyStreakOnLogin(user) {
      if (!user.stats) {
        user.stats = { lastLoginDate: '', loginStreak: 0, claimedDaily: [], topupCount: 0, claimedTopup: [], spinCount: 0, claimedSpin: [] };
      }
      const today = getTodayDateStr();
      const last = user.stats.lastLoginDate;
      if (!last) {
        user.stats.lastLoginDate = today;
        user.stats.loginStreak = 1;
      } else if (last !== today) {
        const diff = diffCalendarDays(last, today);
        if (diff === 1) {
          user.stats.loginStreak = (user.stats.loginStreak || 0) + 1;
        } else if (diff > 1) {
          user.stats.loginStreak = 1;
          user.stats.claimedDaily = [];
        }
        user.stats.lastLoginDate = today;
      }
    }

    // Batasi waktu tunggu operasi Firestore yang tidak kritis agar koneksi lambat
    // tidak menahan pemain di layar login. Operasi aslinya tetap dapat selesai di latar belakang.
    function withCloudTimeout(promise, ms, label) {
      let timer;
      return Promise.race([
        Promise.resolve(promise),
        new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error(`${label} melewati batas ${Math.round(ms / 1000)} detik`)), ms);
        })
      ]).finally(() => clearTimeout(timer));
    }

    async function loadOwnProfileForLogin(email, fallbackUser) {
      if (!db || !firebaseUser) return fallbackUser || null;
      const ownRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', email);
      const ownSnap = await withCloudTimeout(getDoc(ownRef), 5000, 'Memuat profil');
      if (!ownSnap.exists()) return fallbackUser || null;
      const data = ownSnap.data() || {};
      if (String(data.email || '').toLowerCase() !== email) return fallbackUser || null;
      if (data.uid && data.uid !== firebaseUser.uid) throw new Error('UID profil tidak cocok dengan akun Firebase.');
      const merged = { ...(fallbackUser || {}), ...data, email, uid: firebaseUser.uid };
      delete merged.password;
      ensureUserAccountIntegrity(merged);
      state.users[email] = merged;
      persistLocal();
      return merged;
    }

    window.handleLogin = async function(e) {
      if (e) e.preventDefault();

      const password = document.getElementById('loginPassword').value;

      if (!email.endsWith('@wop.com')) {

      loginInProgress = true;
      const loginButton = document.getElementById('loginSubmitBtn');
      const originalLoginLabel = loginButton ? loginButton.textContent : 'MASUK KE ARENA';
      if (loginButton) { loginButton.disabled = true; loginButton.textContent = 'MENGHUBUNGKAN KE FIREBASE...'; loginButton.setAttribute('aria-busy', 'true'); }

      // Jangan wajibkan Firestore tersedia sebelum autentikasi. Akun OWNER dapat
      // tetap masuk saat dokumen profil cloud belum dibuat / Firestore masih terkunci.
      let user = state.users[email] || null;
      let authenticatedThisAttempt = false;
      if (!user && email === OWNER_EMAIL) {
        user = createOfficialAccounts()[OWNER_EMAIL];
        state.users[email] = user;
        persistLocal();
      }

      try {
        // Jangan biarkan tombol terkunci tanpa batas jika permintaan Auth
        // tersendat karena jaringan/API Firebase. Batas waktu hanya untuk UI;
        // pesan error tetap menjelaskan bahwa koneksi perlu dicoba ulang.
        const credential = await withCloudTimeout(
          signInWithEmailAndPassword(auth, email, password),
          20000,
          'Login Firebase'
        );
        authenticatedThisAttempt = true;
        firebaseUser = credential.user;
        const expectedOfficialUid = OFFICIAL_UID_BY_EMAIL[email];
        if (expectedOfficialUid && credential.user.uid !== expectedOfficialUid) {
          await signOutFirebaseSafely();
          return showToast('UID akun resmi tidak cocok. Akses staf ditolak demi keamanan.', 'error');
        }
        state.cloudReady = true;
        // Listener direktori/chat/grup tidak dimulai sebelum arena tampil.
        // Login hanya mengambil profil milik akun yang sedang masuk. Akun staf
        // tidak perlu menunggu unduhan seluruh daftar pemain untuk membuka arena.
        try {
          user = await loadOwnProfileForLogin(email, user);
        } catch (profileError) {
          console.warn('Profil cloud belum termuat saat login:', profileError?.message || profileError);
          if (!user) throw new Error('Profil pemain belum dapat dimuat. Periksa koneksi internet dan Firestore Rules, lalu coba lagi.');
        }
        if (isOwnerAuth()) {
          // Migrasi top up bukan bagian dari proses login; jalankan di latar belakang.
          migrateLegacyTopupsToPrivate().catch((migrationError) =>
            console.warn('Migrasi data top up lama belum selesai:', migrationError?.code || migrationError)
          );
        } else {
          state.config.pendingTopups = [];
        }
        user = state.users[email] || user;
        if (!user && email === OWNER_EMAIL) {
          user = createOfficialAccounts()[OWNER_EMAIL];
          state.users[email] = user;
        }
        if (!user) {
          await signOutFirebaseSafely();
          return showToast('Login Firebase berhasil, tetapi profil pemain belum ditemukan. Hubungi OWNER.', 'error');
        }
        if (user.uid && user.uid !== firebaseUser.uid) {
          await signOutFirebaseSafely();
          return showToast('UID profil tidak cocok dengan akun Firebase. Hubungi OWNER.', 'error');
        }
        user.uid = firebaseUser.uid;
        if (email === OWNER_EMAIL) {
          user.role = 'owner';
          user.badges = { ...(user.badges || {}), owner: true, admin: false };
          user.banned = false;
          delete user.accountCode;
        } else if (isAdminAuth()) {
          user.role = 'admin';
          user.badges = { ...(user.badges || {}), owner: false, admin: true, v: false, vip: false };
        }
        if (user.banned && !isProtectedOwnerAccount(user)) {
          await signOutFirebaseSafely();
          return showToast('AKUN INI TELAH DIBANNED OLEH STAFF!', 'error');
        }

        delete user.password;
        ensureUserAccountIntegrity(user);
        checkDailyStreakOnLogin(user);
        user.isOnline = true;
        user.lastActive = Date.now();
        state.currentEmail = email;
        // Status online disimpan di latar belakang; jangan tahan perpindahan
        // ke arena hanya untuk menunggu Firestore.
        Promise.resolve().then(() => saveUser(user)).catch((saveError) =>
          console.warn('Status akun akan disinkronkan ulang:', saveError?.code || saveError)
        );
        enterGame();
        Promise.resolve().then(() => initCloudListeners());
        startWopMusic(false);
        showToast(`Selamat datang kembali, ${user.username}! Akun Firebase aktif.`, 'success');
      } catch (error) {
        if (authenticatedThisAttempt && auth?.currentUser) {
          try { await signOutFirebaseSafely(); } catch (signOutError) { console.warn('Pembersihan sesi login gagal:', signOutError?.code || signOutError); }
        }
        const messages = {
          'auth/invalid-credential': 'Email atau password Firebase salah. Pastikan akun sudah terdaftar di Firebase Authentication.',
          'auth/user-not-found': 'Akun belum terdaftar di Firebase Authentication. OWNER perlu membuat akun Firebase terlebih dahulu.',
          'auth/wrong-password': 'Password Firebase salah.',
          'auth/user-disabled': 'Akun Firebase ini dinonaktifkan.',
          'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi beberapa saat.',
          'auth/network-request-failed': 'Koneksi internet bermasalah. Coba lagi.',
          'auth/operation-not-allowed': 'Metode Email/Password belum aktif di Firebase Authentication.'
        };
        const safeMessage = error?.message?.includes('Login Firebase melewati batas')
          ? 'Koneksi ke Firebase terlalu lama (20 detik). Periksa internet, muat ulang website, lalu coba login lagi.'
          : (messages[error.code] || `Login Firebase gagal (${error.code || 'unknown'}): ${error.message || 'Periksa akun dan koneksi.'}`);
        showToast(safeMessage, 'error');
      } finally {
        loginInProgress = false;
        if (loginButton) { loginButton.disabled = false; loginButton.textContent = originalLoginLabel; loginButton.removeAttribute('aria-busy'); }
      }
    };

    // Simpan draft formulir Redeem ketika snapshot Firebase memicu render ulang.
    // Tanpa ini, mainContent.innerHTML mengganti input dan menghapus teks yang sedang diketik.
    function captureOwnerRedeemDraft() {
      if (currentPage !== 'owner' || ownerTab !== 'shop') return null;
      const form = document.getElementById('ownerRedeemForm');
      if (!form) return null;
      const snapshot = { fields: [], focusedId: null, selectionStart: null, selectionEnd: null, selectionDirection: null };
      form.querySelectorAll('input:not([type="file"]), select, textarea').forEach((el) => {
        if (!el.id) return;
        const field = { id: el.id, value: el.value };
        if (el.type === 'checkbox' || el.type === 'radio') field.checked = el.checked;
        if (el.multiple) field.selectedValues = Array.from(el.selectedOptions).map((option) => option.value);
        snapshot.fields.push(field);
        if (el === document.activeElement) {
          snapshot.focusedId = el.id;
          try {
            snapshot.selectionStart = el.selectionStart;
            snapshot.selectionEnd = el.selectionEnd;
            snapshot.selectionDirection = el.selectionDirection;
          } catch (_) {}
        }
      });
      return snapshot;
    }

    function restoreOwnerRedeemDraft(snapshot) {
      if (!snapshot || currentPage !== 'owner' || ownerTab !== 'shop') return;
      const form = document.getElementById('ownerRedeemForm');
      if (!form) return;
      const controls = Array.from(form.querySelectorAll('input:not([type="file"]), select, textarea'));
      snapshot.fields.forEach((saved) => {
        const el = controls.find((control) => control.id === saved.id);
        if (!el) return;
        if (el.type === 'checkbox' || el.type === 'radio') el.checked = Boolean(saved.checked);
        else if (el.multiple && saved.selectedValues) {
          Array.from(el.options).forEach((option) => { option.selected = saved.selectedValues.includes(option.value); });
        } else el.value = saved.value;
      });
      if (snapshot.focusedId) {
        const focused = controls.find((control) => control.id === snapshot.focusedId);
        if (focused) {
          try { focused.focus({ preventScroll: true }); } catch (_) { focused.focus(); }
          if (snapshot.selectionStart != null && typeof focused.setSelectionRange === 'function') {
            try { focused.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd, snapshot.selectionDirection || 'none'); } catch (_) {}
          }
        }
      }
      if (typeof window.toggleRedeemTrialFields === 'function') window.toggleRedeemTrialFields();
      if (ownerRedeemItemImageDataUrl) {
        const preview = document.getElementById('newRedeemItemImagePreview');
        const wrap = document.getElementById('newRedeemItemImageWrap');
        const info = document.getElementById('newRedeemItemImageInfo');
        if (preview) preview.src = ownerRedeemItemImageDataUrl;
        if (info) info.textContent = 'Gambar siap digunakan untuk hadiah Redeem.';
        wrap?.classList.remove('hidden');
      }
    }

    function compressImageForFirestore(file, maxChars = 780000, targets = [[2400,0.94],[2200,0.92],[2000,0.90],[1800,0.88],[1600,0.86]]) {
      return new Promise((resolve, reject) => {
        if (!file || !/^image\/(png|jpeg|webp|gif)$/i.test(file.type || '')) return reject(new Error('Pilih file gambar JPG, PNG, WEBP, atau GIF.'));
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('File gambar gagal dibaca.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Format gambar tidak dapat dibuka.'));
          img.onload = () => {
            const originalWidth = img.naturalWidth || img.width;
            const originalHeight = img.naturalHeight || img.height;
            let best = null;
            for (const [maxSide, quality] of targets) {
              const scale = Math.min(1, maxSide / Math.max(originalWidth, originalHeight));
              const width = Math.max(1, Math.round(originalWidth * scale));
              const height = Math.max(1, Math.round(originalHeight * scale));
              const canvas = document.createElement('canvas');
              canvas.width = width; canvas.height = height;
              const ctx = canvas.getContext('2d', { alpha:false });
              ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
              ctx.fillStyle = '#07111f'; ctx.fillRect(0,0,width,height);
              ctx.drawImage(img,0,0,width,height);
              const dataUrl = canvas.toDataURL('image/jpeg', quality);
              best = { dataUrl, width, height, originalWidth, originalHeight, quality, bytes: Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75) };
              if (dataUrl.length <= maxChars) return resolve(best);
            }
            if (best && best.dataUrl.length <= maxChars) return resolve(best);
            reject(new Error('Ukuran gambar masih terlalu besar setelah kompresi HD. Pilih gambar yang lebih kecil atau crop terlebih dahulu.'));
          };
          img.src = String(reader.result || '');
        };
        reader.readAsDataURL(file);
      });
    }

    window.copyPlayerId = async function(id) {
      const value = String(id || '');
      if (!value) return showToast('Tidak ada teks untuk disalin.', 'error');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
          return showToast('Berhasil disalin ke clipboard!', 'success');
        }
        throw new Error('Clipboard API tidak tersedia pada halaman ini');
      } catch (_) {
        openModal(`
          <div class="space-y-3">
            <h3 class="font-gaming font-black text-sm text-cyan-300">SALIN TEKS</h3>
            <p class="text-xs text-slate-300">Browser membatasi akses clipboard pada halaman ini. Tekan lama teks di bawah, pilih <b>Salin</b>.</p>
            <textarea id="manualCopyValue" readonly class="w-full min-h-[92px] p-3 rounded-xl bg-slate-950 border border-cyan-400 text-sm text-white select-all" onclick="this.select()">${escapeHTML(value)}</textarea>
            <button onclick="document.getElementById('manualCopyValue').focus();document.getElementById('manualCopyValue').select();showToast('Teks sudah dipilih. Tekan lama lalu pilih Salin.','info')" class="w-full py-2.5 rounded-xl bg-cyan-400 text-slate-950 font-gaming font-black text-xs">PILIH TEKS UNTUK DISALIN</button>
            <button onclick="closeModal()" class="w-full py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">TUTUP</button>
          </div>
        `);
        setTimeout(() => { const el = document.getElementById('manualCopyValue'); if (el) { el.focus(); el.select(); } }, 60);
      }
    };

    function initBattleSetupDefaults() {
      const user = getCurrentUser();
      if (!user) return;
      ensureUserAccountIntegrity(user);
      const inv = user.inventory || [];
      const heroes = inv.filter((i) => i.category === 'HERO');
      const shields = inv.filter((i) => i.category === 'PERISAI');
      const medkits = inv.filter((i) => i.category === 'MEDKIT');
      const pusakas = inv.filter((i) => i.category === 'PUSAKA SAKTI');

      if (!heroes.some((h) => h.uid === battleState.selectedHeroUid)) {
        battleState.selectedHeroUid = heroes[0] ? heroes[0].uid : '';
      }
      if (!shields.some((s) => s.uid === battleState.selectedShieldUid)) {
        battleState.selectedShieldUid = shields[0] ? shields[0].uid : '';
      }
      battleState.selectedMedkitUids = battleState.selectedMedkitUids.filter((uid) => medkits.some((m) => m.uid === uid));
      if (battleState.selectedMedkitUids.length === 0 && medkits.length > 0) {
        battleState.selectedMedkitUids = medkits.slice(0, 3).map((m) => m.uid);
      }
      if (!pusakas.some((p) => p.uid === battleState.selectedPusakaUid)) {
        battleState.selectedPusakaUid = pusakas[0] ? pusakas[0].uid : '';
      }
    }

    function generateProPlayerCombatant(excludeNames = new Set()) {
      const candidates = NATURAL_PRO_PLAYERS.filter((p) => !excludeNames.has(p.username));
      const pick = candidates[Math.floor(Math.random() * candidates.length)] || NATURAL_PRO_PLAYERS[0];
      excludeNames.add(pick.username);

      const heroPool = [
        { name: 'Pangeran Naga Sakti', rarity: 'MYTHIC', hp: 5200, damage: 980, image: makeSvgBadge('PANGERAN NAGA', '#e11d48', '#881337', '👑') },

        { name: 'Raja Petir Nusantara', rarity: 'MYTHIC', hp: 5600, damage: 1050, image: makeSvgBadge('RAJA PETIR', '#d97706', '#78350f', '⚡') },
        { name: 'Assasin Bayangan', rarity: 'EPIC', hp: 3800, damage: 760, image: makeSvgBadge('ASSASIN', '#7c3aed', '#3b0764', '🗡️') }

      const shieldPool = [

        { name: 'Perisai Besi Pelindung', hp: 750, image: makeSvgBadge('PERISAI', '#0e7490', '#0f172a', '🔰') }

      const pusakaPool = [

        { name: 'Pedang Halilintar Naga', damage: 1380, image: makeSvgBadge('HALILINTAR', '#6d28d9', '#2e1065', '🐉') }
      ];

      const h = heroPool[Math.floor(Math.random() * heroPool.length)];
      const s = shieldPool[Math.floor(Math.random() * shieldPool.length)];
      const p = pusakaPool[Math.floor(Math.random() * pusakaPool.length)];

        shield: s,

                  <div class="py-4 text-center text-[10px] text-slate-400">Klik <b>🔍 CARI PEMAIN JAGO</b> untuk mencari lawan!</div>
