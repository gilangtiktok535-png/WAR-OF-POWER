              </div>
            `}
          `}
        </div>
      `;
    }

    async function enforceGroupProfanityFilter(user, grp, rawText) {
      if (isProtectedOwnerAccount(user)) return false;
      const detectedWord = detectProfanity(rawText);
      if (!detectedWord) return false;

      const modCfg = state.config.groupModeration || { maxViolations: 3, autoAction: 'kick' };
      const maxViol = Number(modCfg.maxViolations || 3);

      state.config.groupViolations = state.config.groupViolations || [];
      let record = state.config.groupViolations.find((v) => v.userEmail === user.email && v.groupId === grp.id);
      if (!record) {
        record = {
          id: 'viol_' + Date.now(),
          userEmail: user.email,
          userId: user.id,
          username: user.username,
          groupId: grp.id,
          groupName: grp.name,
          count: 0,
          lastWord: detectedWord,
          lastTime: ''
        };
        state.config.groupViolations.unshift(record);
      }
      record.count += 1;
      record.lastWord = detectedWord;
      record.lastTime = new Date().toLocaleString('id-ID');

      const warningMessage = { id: 'sys_warn_' + Date.now(), type: 'system', senderName: 'AI MODERATOR', text: `⚠️ PERINGATAN AI MODERATOR: ${user.username} terdeteksi mengucapkan kata kasar/terlarang! (Pelanggaran ${record.count}/${maxViol})`, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
      grp.messages.push(warningMessage);
      try { await saveGroupMessage(grp, warningMessage); } catch (error) { console.warn('Peringatan grup gagal disimpan:', error?.code || error); }

      if (record.count >= maxViol) {
        grp.members = (grp.members || []).filter((em) => em !== user.email);
        grp.admins = (grp.admins || []).filter((em) => em !== user.email);
        grp.kickedMembers = grp.kickedMembers || [];
        if (!grp.kickedMembers.includes(user.email)) grp.kickedMembers.push(user.email);

        const kickMessage = { id: 'sys_kick_' + Date.now(), type: 'system', senderName: 'AI MODERATOR', text: `🚫 ${user.username} otomatis DI-KICK dari grup karena mencapai batas ${maxViol}× pelanggaran kata kasar!`, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
        grp.messages.push(kickMessage);
        try { await saveGroupMessage(grp, kickMessage); await updateDoc(groupDocumentRef(grp.id), { members: arrayRemove(user.email), admins: arrayRemove(user.email), kickedMembers: arrayUnion(user.email), unreadFor: arrayRemove(user.email) }); }
        catch (error) { console.warn('Auto-kick grup gagal disimpan:', error?.code || error); }

        if (modCfg.autoAction === 'ban' && !isAdminProfile(user)) {
          user.banned = true;
          await saveUser(user);
        }

        activeGroupId = null;
        closeFullscreenOverlay();
        showToast(`Kamu dikeluarkan dari grup karena melanggar batas ${maxViol}× kata terlarang!`, 'error');
        scheduleRender();
        return true;
      }

      showToast(`⚠️ Peringatan Kata Kasar (${record.count}/${maxViol})! Jangan berkata kasar/18+ di grup!`, 'error');
      scheduleRender();
      return true;
    }

    window.sendGroupTextMessage = async function(groupId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      const inp = document.getElementById('groupChatTextInput');
      if (!user || !grp || !inp) return;
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';

      const blocked = await enforceGroupProfanityFilter(user, grp, text);
      if (blocked) return;

      const message = { id: 'gm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), type: 'text', senderEmail: user.email, senderName: user.username, text, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
      grp.messages.push(message);
      try { await saveGroupMessage(grp, message); }
      catch (error) { grp.messages = grp.messages.filter((m) => m.id !== message.id); showToast(error.message || 'Pesan gagal dikirim.', 'error'); }
      scheduleRender();
    };

    window.sendGroupSticker = async function(groupId, stickerId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;

      const message = { id: 'gstk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), type: 'sticker', senderEmail: user.email, senderName: user.username, stickerId, text: '[Stiker]', time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
      grp.messages.push(message);
      try { await saveGroupMessage(grp, message); groupStickerDrawerOpen = false; }
      catch (error) { grp.messages = grp.messages.filter((m) => m.id !== message.id); showToast(error.message || 'Stiker gagal dikirim.', 'error'); }
      scheduleRender();
    };

    window.openCreateGroupPollModal = function(groupId) {
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <h3 class="font-gaming font-black text-xs text-cyan-300">📊 BUAT POLLING GRUP</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
          </div>
          <input id="pollQuestionInp" type="text" placeholder="Pertanyaan polling (misal: Mabar jam berapa?)..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
          <input id="pollOpt1Inp" type="text" placeholder="Pilihan 1..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
          <input id="pollOpt2Inp" type="text" placeholder="Pilihan 2..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
          <input id="pollOpt3Inp" type="text" placeholder="Pilihan 3 (opsional)..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
          <button onclick="submitGroupPoll('${groupId}')" class="w-full py-2.5 rounded-xl bg-cyan-400 text-slate-950 font-gaming font-black text-xs">KIRIM POLLING KE GRUP</button>
        </div>
      `);
    };

    window.submitGroupPoll = async function(groupId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;
      const q = document.getElementById('pollQuestionInp').value.trim();
      const o1 = document.getElementById('pollOpt1Inp').value.trim();
      const o2 = document.getElementById('pollOpt2Inp').value.trim();
      const o3 = document.getElementById('pollOpt3Inp').value.trim();

      if (!q || !o1 || !o2) return showToast('Pertanyaan dan minimal 2 pilihan wajib diisi!', 'error');
      const combined = `${q} ${o1} ${o2} ${o3}`;
      if (detectProfanity(combined)) return showToast('Polling mengandung kata terlarang!', 'error');

      const options = [{ label: o1, voters: [] }, { label: o2, voters: [] }];
      if (o3) options.push({ label: o3, voters: [] });

      const message = { id: 'gpoll_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), type: 'poll', senderEmail: user.email, senderName: user.username, text: q, question: q, options, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
      grp.messages.push(message);
      try { await saveGroupMessage(grp, message); }
      catch (error) { grp.messages = grp.messages.filter((m) => m.id !== message.id); return showToast(error.message || 'Polling gagal dikirim.', 'error'); }
      closeModal();
      scheduleRender();
    };

    window.voteInGroupPoll = async function(groupId, msgId, optIdx) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;
      const msg = (grp.messages || []).find((m) => m.id === msgId);
      if (!msg || !msg.options) return;

      msg.options.forEach((opt) => {
        opt.voters = (opt.voters || []).filter((em) => em !== user.email);
      });
      if (!msg.options[optIdx]) return;
      msg.options[optIdx].voters.push(user.email);
      try { await updateDoc(groupMessageDocumentRef(groupId, msgId), { options: msg.options }); }
      catch (error) { showToast(error.message || 'Suara polling gagal disimpan.', 'error'); }
      scheduleRender();
    };

    window.deleteGroupMessage = async function(groupId, msgId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;
      const msg = (grp.messages || []).find((m) => m.id === msgId);
      const canDelete = msg && (msg.senderEmail === user.email ||
        (grp.creatorEmail === user.email) || (grp.admins || []).includes(user.email));
      if (!canDelete) return showToast('Kamu hanya dapat menghapus pesan sendiri.', 'error');
      if (!window.confirm('Hapus pesan ini?')) return;
      try { await deleteDoc(groupMessageDocumentRef(groupId, msgId)); }
      catch (error) { return showToast(error.message || 'Pesan gagal dihapus.', 'error'); }
      grp.messages = (grp.messages || []).filter((m) => m.id !== msgId);
      showToast('Pesan berhasil dihapus.', 'success');
      scheduleRender();
    };

    window.saveGroupProfileEdit = async function(groupId) {
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!grp) return;
      const newName = document.getElementById('editGroupNameInp').value.trim();
      const newDesc = document.getElementById('editGroupDescInp').value.trim();
      if (newName) grp.name = newName.toUpperCase();
      grp.desc = newDesc;
      try { await saveGroupMetadata(grp); }
      catch (error) { return showToast(error.message || 'Profil grup gagal disimpan.', 'error'); }
      showToast('Profil grup diperbarui!', 'success');
      scheduleRender();
    };

    window.changeGroupAvatarFile = function(ev, groupId) {
      const file = ev.target.files[0];
      if (!file) return;
      compressImageFile(file, async (dataUrl) => {
        const grp = (state.config.groups || []).find((g) => g.id === groupId);
        if (!grp) return;
        grp.avatar = dataUrl;
        try { await saveGroupMetadata(grp); }
        catch (error) { return showToast(error.message || 'Foto grup gagal disimpan.', 'error'); }
        showToast('Foto profil grup berhasil diganti!', 'success');
        scheduleRender();
      }, 180);
    };

    window.invitePlayerToGroup = async function(groupId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      const q = document.getElementById('inviteMemberToGroupInp').value.trim();
      const target = findUserByQuery(q);
      if (!grp || !target) return showToast('Pemain tidak ditemukan!', 'error');
      if (!user || (grp.creatorEmail !== user.email && !(grp.admins || []).includes(user.email) && !isStaffAuth())) return showToast('Hanya admin grup yang dapat mengundang pemain.', 'error');
      if ((grp.members || []).includes(target.email)) return showToast('Pemain sudah ada di dalam grup!', 'info');

      grp.kickedMembers = (grp.kickedMembers || []).filter((em) => em !== target.email);
      grp.members.push(target.email);
      const message = { id: 'ginv_' + Date.now(), type: 'system', senderName: 'SYSTEM', text: `${user.username} mengundang ${target.username} (${target.id}) ke dalam grup.`, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
      grp.messages.push(message);
      try { await updateDoc(groupDocumentRef(groupId), { members: arrayUnion(target.email), kickedMembers: arrayRemove(target.email) }); await saveGroupMessage(grp, message); }
      catch (error) { grp.members = grp.members.filter((em) => em !== target.email); return showToast(error.message || 'Undangan gagal disimpan.', 'error'); }
      showToast(`${target.username} berhasil ditambahkan ke grup!`, 'success');
      scheduleRender();
    };

    window.toggleGroupMemberAdmin = async function(groupId, memberEmail) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!grp || !user || (grp.creatorEmail !== user.email && !(grp.admins || []).includes(user.email) && !isStaffAuth())) return showToast('Hanya admin grup yang dapat mengatur admin.', 'error');
      grp.admins = grp.admins || [];
      if (grp.admins.includes(memberEmail)) {
        grp.admins = grp.admins.filter((em) => em !== memberEmail);
      } else {
        grp.admins.push(memberEmail);
      }
      try { await saveGroupMetadata(grp); }
      catch (error) { return showToast(error.message || 'Pengaturan admin gagal disimpan.', 'error'); }
      scheduleRender();
    };

    window.kickGroupMember = async function(groupId, memberEmail) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      const target = state.users[memberEmail];
      if (!grp || !target || grp.creatorEmail === memberEmail) return;
      if (!user || (grp.creatorEmail !== user.email && !(grp.admins || []).includes(user.email) && !isStaffAuth())) return showToast('Kamu tidak memiliki izin untuk mengeluarkan anggota.', 'error');

      grp.members = (grp.members || []).filter((em) => em !== memberEmail);
      grp.admins = (grp.admins || []).filter((em) => em !== memberEmail);
      grp.kickedMembers = grp.kickedMembers || [];
      if (!grp.kickedMembers.includes(memberEmail)) grp.kickedMembers.push(memberEmail);

      const message = { id: 'gkick_' + Date.now(), type: 'system', senderName: 'ADMIN GRUP', text: `🚫 ${target.username} telah dikeluarkan (Kick) dari grup oleh ${user.username}.`, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
      grp.messages.push(message);
      try { await saveGroupMetadata(grp); await saveGroupMessage(grp, message); }
      catch (error) { return showToast(error.message || 'Aksi kick gagal disimpan.', 'error'); }
      showToast(`${target.username} dikeluarkan dari grup!`, 'info');
      scheduleRender();
    };

    window.exitFromGroup = async function(groupId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;

      grp.members = (grp.members || []).filter((em) => em !== user.email);
      grp.admins = (grp.admins || []).filter((em) => em !== user.email);
      const message = { id: 'gexit_' + Date.now(), type: 'system', senderName: 'SYSTEM', text: `${user.username} keluar dari grup.`, time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) };
      grp.messages.push(message);
      try { await saveGroupMessage(grp, message); await updateDoc(groupDocumentRef(groupId), { members: arrayRemove(user.email), admins: arrayRemove(user.email), unreadFor: arrayRemove(user.email) }); }
      catch (error) { return showToast(error.message || 'Gagal keluar dari grup.', 'error'); }
      activeGroupId = null;
      closeFullscreenOverlay();
      showToast('Kamu telah keluar dari grup.', 'info');
      scheduleRender();
    };

    window.likePlayerById = async function(targetId) {
      const user = getCurrentUser();
      const target = findUserByQuery(targetId);
      if (!user || !target) return;
      target.likedBy = target.likedBy || [];
      if (target.likedBy.includes(user.email)) {
        target.likedBy = target.likedBy.filter((email) => email !== user.email);
        target.likes = Math.max(0, Number(target.likes || 0) - 1);
        await saveUser(target);
        showToast(`Like dari ${target.username} dibatalkan.`, 'info');
      } else {
        target.likedBy.push(user.email);
        target.likes = (target.likes || 0) + 1;
        await saveUser(target);
        playBeep(760, 0.08);
        showToast(`❤️ Kamu menyukai ${target.username} (${target.id})!`, 'success');
      }
      if (activeChatFriendId === target.id) {
        renderFullscreenFriendChat();
      } else {
        scheduleRender();
      }
    };

    window.sendFriendRequest = async function(targetEmail) {
      const user = getCurrentUser();
      const requesterEmail = String(user?.email || firebaseUser?.email || '').toLowerCase();
      const normalizedTargetEmail = String(targetEmail || '').toLowerCase();
      const target = state.users[normalizedTargetEmail];
      if (!user || !target || !requesterEmail || !normalizedTargetEmail || normalizedTargetEmail === requesterEmail) return;
      if (!db || !state.cloudReady || !firebaseUser) return showToast('Koneksi akun belum siap. Coba lagi saat online.', 'error');
      try {
        // Tambahkan hanya permintaan dari akun yang sedang login; jangan menulis ulang profil pemain lain.
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', normalizedTargetEmail), {
          friendRequests: arrayUnion(requesterEmail)
        });
        target.friendRequests = Array.from(new Set([...(target.friendRequests || []), requesterEmail]));
        showToast(`Permintaan pertemanan terkirim ke ${target.username}!`, 'success');
        scheduleRender();
      } catch (error) {
        console.warn('Permintaan pertemanan gagal:', error?.code || error);
        showToast(error?.code === 'permission-denied' ? 'Firestore menolak permintaan teman. Periksa Rules.' : 'Permintaan teman gagal dikirim. Periksa koneksi.', 'error');
      }
    };

    window.acceptFriendRequest = async function(senderEmail) {
      const user = getCurrentUser();
      const ownEmail = String(user?.email || firebaseUser?.email || '').toLowerCase();
      const normalizedSenderEmail = String(senderEmail || '').toLowerCase();
      const sender = state.users[normalizedSenderEmail];
      if (!user || !sender || !ownEmail || !normalizedSenderEmail) return;
      const oldFriends = [...(user.friends || [])];
      const oldRequests = [...(user.friendRequests || [])];
      if (!oldRequests.some((email) => String(email).toLowerCase() === normalizedSenderEmail)) return showToast('Permintaan pertemanan tidak ditemukan.', 'error');
      if (!db || !state.cloudReady || !firebaseUser) return showToast('Koneksi akun belum siap. Coba lagi saat online.', 'error');
      try {
        // Hanya ubah dua array sosial di profil sendiri; jangan kirim ulang seluruh data pemain.
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', ownEmail), {
          friendRequests: arrayRemove(normalizedSenderEmail),
          friends: arrayUnion(normalizedSenderEmail)
        });
      } catch (error) {
        console.warn('Persetujuan teman gagal:', error?.code || error);
        return showToast('Persetujuan teman gagal disimpan. Periksa Firestore Rules.', 'error');
      }
      user.friendRequests = oldRequests.filter((email) => String(email).toLowerCase() !== normalizedSenderEmail);
      user.friends = Array.from(new Set([...oldFriends, normalizedSenderEmail]));
      try {
        // Akun penerima hanya menambahkan dirinya ke daftar teman pengirim; profil lain tidak ditulis ulang.
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', normalizedSenderEmail), {
          friends: arrayUnion(ownEmail)
        });
        sender.friends = Array.from(new Set([...(sender.friends || []), ownEmail]));
        showToast(`Sekarang kamu berteman dengan ${sender.username}!`, 'success');
        scheduleRender();
      } catch (error) {
        console.warn('Sinkronisasi teman gagal:', error?.code || error);
        showToast('Permintaan diterima di akunmu, tetapi daftar teman pengirim belum tersinkron. Coba buka ulang.', 'error');
        scheduleRender();
      }
    };

    window.rejectFriendRequest = async function(senderEmail) {
      const user = getCurrentUser();
      const normalizedSenderEmail = String(senderEmail || '').toLowerCase();
      if (!user || !normalizedSenderEmail) return;
      const oldRequests = [...(user.friendRequests || [])];
      if (!db || !state.cloudReady || !firebaseUser) return showToast('Koneksi akun belum siap. Coba lagi saat online.', 'error');
      try {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_players', String(user.email).toLowerCase()), {
          friendRequests: arrayRemove(normalizedSenderEmail)
        });
        user.friendRequests = oldRequests.filter((email) => String(email).toLowerCase() !== normalizedSenderEmail);
        scheduleRender();
      } catch (error) {
        console.warn('Penolakan permintaan teman gagal:', error?.code || error);
        showToast('Permintaan teman gagal ditolak. Periksa Firestore Rules.', 'error');
      }
    };

                </button>
              </div>
            ` : ''}
          </div>

            <div class="p-2.5 rounded-xl bg-slate-900 border border-amber-400/50 flex items-center justify-between gap-2">
              <button onclick="toggleSelectAllMessages()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-[10px] font-bold text-cyan-300">
                ${selectedCount === msgs.length ? 'Batal Pilih Semua' : `Pilih Semua (${msgs.length})`}

                🗑️ HAPUS TERPILIH (${selectedCount})

            </div>
          ` : ''}

            return `
              <div onclick="${messageSelectMode ? `toggleSingleMessageSelect('${m.id}')` : ''}" class="glass-card rounded-2xl p-3.5 border ${isChecked ? 'border-amber-400 bg-amber-500/10' : 'border-cyan-500/30'} space-y-1.5 ${messageSelectMode ? 'cursor-pointer' : ''}">

                  <div class="flex items-center gap-2 min-w-0">
                    ${messageSelectMode ? `
                      <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleSingleMessageSelect('${m.id}')" class="w-4 h-4 accent-amber-400 rounded shrink-0" />

    window.toggleMessageSelectMode = function() {
      messageSelectMode = !messageSelectMode;
      selectedMessageIds.clear();
      scheduleRender();
    };

    window.toggleSingleMessageSelect = function(msgId) {
      if (selectedMessageIds.has(msgId)) selectedMessageIds.delete(msgId);
      else selectedMessageIds.add(msgId);
      scheduleRender();
    };

    window.toggleSelectAllMessages = function() {
      const user = getCurrentUser();
      if (!user) return;
      const msgs = user.messages || [];
      if (selectedMessageIds.size === msgs.length) {
        selectedMessageIds.clear();
      } else {
        msgs.forEach((m) => selectedMessageIds.add(m.id));
      }
      scheduleRender();
    };

    window.deleteSingleInboxMessage = async function(msgId) {
      const user = getCurrentUser();
      if (!user) return;
      user.messages = (user.messages || []).filter((m) => m.id !== msgId);
      selectedMessageIds.delete(msgId);
      await saveUser(user);
      showToast('Pesan dihapus.', 'info');
      scheduleRender();
    };

    window.deleteSelectedInboxMessages = async function() {
      const user = getCurrentUser();
      if (!user || selectedMessageIds.size === 0) return;
      const delCount = selectedMessageIds.size;
      user.messages = (user.messages || []).filter((m) => !selectedMessageIds.has(m.id));
      selectedMessageIds.clear();
      messageSelectMode = false;
      await saveUser(user);
      showToast(`${delCount} pesan terpilih berhasil dihapus!`, 'success');
      scheduleRender();
    };

    window.deleteAllInboxMessages = function() {
      const user = getCurrentUser();
      if (!user || !(user.messages || []).length) return;

    window.saveProfileCredentials = async function() {
      const user = getCurrentUser();
      if (!user) return;

      const newName = (document.getElementById('profNewUsername')?.value || '').trim();
      const rawPrefix = (document.getElementById('profNewEmailPrefix')?.value || '').trim().toLowerCase().replace(/@.*$/, '');
      const newPassword = (document.getElementById('profNewPassword')?.value || '').trim();

      if (!newName) return showToast('Username tidak boleh kosong!', 'error');
      if (!rawPrefix || !/^[a-z0-9._-]+$/.test(rawPrefix)) {
        return showToast('Nama depan email hanya boleh huruf, angka, titik, underscore, atau strip!', 'error');
      }
      if (newPassword && newPassword.length < 6) {
        return showToast('Password baru minimal 6 karakter!', 'error');
      }
      const oldEmail = user.email;
      const newEmail = `${rawPrefix}@wop.com`;
      try {
        if (newPassword) await updatePassword(auth.currentUser, newPassword);
        if (newEmail !== oldEmail) await updateEmail(auth.currentUser, newEmail);
      } catch (error) {
        return showToast(`Gagal memperbarui kredensial Firebase: ${error.message || error.code}`, 'error');
      }

      if (newEmail !== oldEmail && state.users[newEmail]) {
        return showToast('Email tersebut sudah dipakai akun lain!', 'error');
      }

      user.username = newName.toUpperCase();
      delete user.password;
      delete user.accountCode;

      if (newEmail !== oldEmail) {
        user.email = newEmail;
        delete state.users[oldEmail];
        state.users[newEmail] = user;
        state.currentEmail = newEmail;

        // Perbarui referensi email di teman & grup agar tetap terhubung
        Object.values(state.users).forEach((other) => {
          if (!other) return;
          if (Array.isArray(other.friends)) {
            other.friends = other.friends.map((em) => (em === oldEmail ? newEmail : em));
          }
          if (Array.isArray(other.friendRequests)) {
            other.friendRequests = other.friendRequests.map((em) => (em === oldEmail ? newEmail : em));
          }
          if (Array.isArray(other.likedBy)) {
            other.likedBy = other.likedBy.map((em) => (em === oldEmail ? newEmail : em));
          }
        });
        (state.config.groups || []).forEach((g) => {
          if (g.creatorEmail === oldEmail) g.creatorEmail = newEmail;
          if (Array.isArray(g.admins)) g.admins = g.admins.map((em) => (em === oldEmail ? newEmail : em));
          if (Array.isArray(g.members)) g.members = g.members.map((em) => (em === oldEmail ? newEmail : em));
        });

        await deleteCloudUserDoc(oldEmail);
        await saveConfig();
      }

      await saveUser(user);
      showToast('Profil dan kredensial Firebase berhasil diperbarui!', 'success');
      scheduleRender();
    };

    window.previewOwnerGalleryImage = async function(input) {
      if (!isProtectedOwnerAccount(getCurrentUser())) return showToast('Khusus Owner.', 'error');
      const file = input?.files?.[0];
      const wrap = document.getElementById('ownerGalleryPreviewWrap');
      const img = document.getElementById('ownerGalleryPreview');
      const info = document.getElementById('ownerGalleryImageInfo');
      ownerGalleryPendingImage = null;
      if (!file) { wrap?.classList.add('hidden'); img?.removeAttribute('src'); return; }
      try {
        const result = await compressImageForFirestore(file, 780000);
        ownerGalleryPendingImage = result;
        if (img) img.src = result.dataUrl;
        if (info) info.textContent = `Asli ${result.originalWidth}×${result.originalHeight} px → tersimpan ${result.width}×${result.height} px • ${(result.bytes/1024).toFixed(0)} KB • kualitas JPEG ${Math.round(result.quality*100)}%`;
        wrap?.classList.remove('hidden');
        if (result.originalWidth < 1280 || result.originalHeight < 400) showToast('Sumber gambar beresolusi kecil. Untuk banner tajam, gunakan minimal 1600×500 px.', 'info');
      } catch (error) {
        input.value = ''; wrap?.classList.add('hidden');
        showToast(error.message || 'Gambar gagal diproses.', 'error');
      }
    };

    window.uploadOwnerGalleryImage = async function() {
      const owner = getCurrentUser();
      if (!isProtectedOwnerAccount(owner)) return showToast('Khusus Owner.', 'error');
      if (!db || !state.cloudReady || !firebaseUser) return showToast('Koneksi Firebase belum siap.', 'error');
      if (!ownerGalleryPendingImage?.dataUrl) return showToast('Pilih gambar dari galeri HP terlebih dahulu.', 'error');
      const name = (document.getElementById('ownerGalleryName')?.value || '').trim() || `GAMBAR WOP ${new Date().toLocaleDateString('id-ID')}`;
      const assetId = `gallery_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
      const asset = {
        name: name.slice(0,48),
        imageData: ownerGalleryPendingImage.dataUrl,
        width: ownerGalleryPendingImage.width,
        height: ownerGalleryPendingImage.height,
        originalWidth: ownerGalleryPendingImage.originalWidth,
        originalHeight: ownerGalleryPendingImage.originalHeight,
        bytes: ownerGalleryPendingImage.bytes,
        mime: 'image/jpeg',
        createdAt: new Date().toISOString(),
        createdBy: owner.email
      };
      try {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_media_gallery', assetId), asset);
        ownerGalleryPendingImage = null;
        const fileInput = document.getElementById('ownerGalleryFile'); if (fileInput) fileInput.value = '';
        const nameInput = document.getElementById('ownerGalleryName'); if (nameInput) nameInput.value = '';
        document.getElementById('ownerGalleryPreviewWrap')?.classList.add('hidden');
        showToast('Gambar berhasil disimpan ke galeri bersama.', 'success');
        scheduleRender();
      } catch (error) {
        console.warn('Upload gambar galeri gagal:', error?.code || error);
        showToast(`Upload galeri ditolak Firestore (${error?.code || 'error'}). Periksa izin path wop_media_gallery pada Rules.`, 'error');
      }
    };

    window.deleteOwnerGalleryImage = async function(assetId) {
      if (!isProtectedOwnerAccount(getCurrentUser())) return;
      const asset = getGalleryAsset(assetId);
      if (!asset) return;
      if (!confirm(`Hapus gambar “${asset.name || 'Gambar'}” dari galeri?`)) return;
      if (!db || !state.cloudReady) return showToast('Koneksi cloud belum siap.', 'error');
      try {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'wop_media_gallery', assetId));
        (state.config.savedThemes || []).forEach((theme) => { if (theme.galleryAssetId === assetId) delete theme.galleryAssetId; });
        if (state.config.websiteTheme?.galleryAssetId === assetId) delete state.config.websiteTheme.galleryAssetId;
        Object.keys(state.config.pageArtwork || {}).forEach((page) => { if (state.config.pageArtwork[page] === assetId) delete state.config.pageArtwork[page]; });

        showToast('Gambar galeri dan semua tautan tampilannya dihapus.', 'success'); scheduleRender();

    window.toggleUserBadge = async function(email, badgeKey) {
      const currentActor = getCurrentUser();
      const target = state.users[email];
      if (!currentActor || !target) return;

      const actorIsOwner = isProtectedOwnerAccount(currentActor);
      const targetIsOwner = isOwnerProfile(target);
      if ((badgeKey === 'v' || badgeKey === 'vip') && !actorIsOwner) {
        return showToast('Hanya OWNER yang boleh mengatur centang V/VIP.', 'error');
      }
      if ((badgeKey === 'v' || badgeKey === 'vip') && isAdminProfile(target) && !actorIsOwner) {
        return showToast('Admin tidak memiliki izin mengatur centang V/VIP.', 'error');
      }
      const ownerSelfBadgeEdit = actorIsOwner && targetIsOwner && currentActor.email === email && (badgeKey === 'v' || badgeKey === 'vip');

      // OWNER boleh mengatur V/VIP miliknya sendiri, tetapi lencana OWNER tetap permanen.
      if (targetIsOwner && !ownerSelfBadgeEdit) {
        return showToast('Lencana OWNER permanen dan hanya V/VIP milik OWNER yang dapat diatur!', 'error');
      }
      if (badgeKey === 'owner') {
        return showToast('Lencana OWNER tidak dapat dihapus atau diubah!', 'error');
      }

      // Aturan khusus Admin: Admin tidak bisa ubah centang V/VIP untuk dirinya sendiri.
      if (!actorIsOwner && currentActor.email === email && (badgeKey === 'v' || badgeKey === 'vip')) {
        return showToast('Admin tidak diizinkan mengubah centang V/VIP pada akunnya sendiri!', 'error');
      }

      target.badges = target.badges || {};
      target.badges[badgeKey] = !target.badges[badgeKey];
      if (badgeKey === 'admin') {
        target.role = target.badges.admin ? 'admin' : 'player';
      }
      await saveUser(target);
      showToast(`Status ${badgeKey.toUpperCase()} untuk ${target.username} diperbarui!`, 'success');
      scheduleRender();
    };

    window.settleAuctionWinners = async function() {
      const auc = state.config.auction;
      if (!auc || auc.settled) return showToast('Lelang sudah diselesaikan!', 'info');

      const sorted = [...(auc.bids || [])].sort((a, b) => b.amount - a.amount);
      const winners = sorted.slice(0, 3);
      const losers = sorted.slice(3);

      for (let i = 0; i < winners.length; i++) {
        const w = winners[i];
        const serial = `#00${i + 1}`;
        const target = state.users[w.email];
        if (target) {
          target.inventory.push({
            uid: 'auc_win_' + Date.now() + '_' + i,
            name: `${auc.itemName} (${serial})`,
            category: auc.category,
            rarity: auc.rarity,
            hp: auc.hp || 7500,
            damage: auc.damage,
            serialNumber: serial,
            desc: `Pemenang Lelang Nomor Seri ${serial}. ${auc.desc}`,
            image: auc.image
          });
          target.messages.unshift({
            id: 'auc_msg_' + Date.now() + '_' + i,
            title: `🏆 PEMENANG LELANG SERI ${serial}!`,
            body: `Selamat! Kamu memenangkan lelang "${auc.itemName}" dengan Nomor Seri ${serial}! Item sudah masuk ke Penyimpananmu.`,
            from: 'BALAI LELANG',
            time: new Date().toLocaleString('id-ID'),
            read: false
          });
          await saveUser(target);
        }
      }

      for (const l of losers) {
        const target = state.users[l.email];
        if (target) {
          target.diamond = (target.diamond || 0) + l.amount;
          await saveUser(target);
        }

      auc.settled = true;
      await saveConfig();
      showToast('Lelang selesai! Item Seri #001, #002, #003 dibagikan ke pemenang!', 'success');
      scheduleRender();
    };

    async function compressCommunityLogo(file) {
      if (!file) return '';
      if (!file.type || !file.type.startsWith('image/')) throw new Error('File harus berupa gambar.');
      if (file.size > 12 * 1024 * 1024) throw new Error('Ukuran gambar asli maksimal 12 MB.');
      const sourceUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Gagal membaca gambar dari galeri.'));
        reader.readAsDataURL(file);
      });
      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('Gambar tidak dapat dibuka.'));
        image.src = sourceUrl;
      });
      // Logo dipertahankan hingga 1440 px agar tetap tajam pada layar HD/retina.
      const scale = Math.min(1, 1440 / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('Browser tidak mendukung pemrosesan gambar.');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      let quality = 0.94;
      let result = canvas.toDataURL('image/webp', quality);
      while (result.length > 300000 && quality > 0.82) {
        quality -= 0.03;
        result = canvas.toDataURL('image/webp', quality);
      }
      if (result.length > 340000) throw new Error('Ukuran logo masih terlalu besar untuk disimpan dengan aman. Pilih gambar HD lain yang lebih sederhana.');
      return result;
    }

                        ${(!isSelfAcc && !isOtherAdmin) ? `<button onclick="openOwnerDiamondModal('${u.email}', 'sub')" class="py-1.5 rounded-lg bg-rose-500/20 border border-rose-400 text-rose-300 text-[10px] font-bold">
                          - Kurangi Diamond
                        </button>
                        <button onclick="openOwnerRankModal('${u.email}')" class="py-1.5 rounded-lg bg-amber-500/20 border border-amber-400 text-amber-300 text-[10px] font-bold">
                          🏅 Ubah Rank
                        </button>` : `<span class="col-span-2 text-center text-[9px] text-slate-500 py-2">Aksi rank & pengurangan Diamond dikunci untuk diri sendiri / sesama admin</span>`}
                        <button onclick="openOwnerDirectMessageModal('${u.email}')" class="py-1.5 rounded-lg bg-cyan-500/20 border border-cyan-400 text-cyan-300 text-[10px] font-bold">
                          ✉️ Kirim Pesan
                        </button>
                      </div>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    window.setAdminTab = function(t) { adminTab = t; scheduleRender(); };

    function startWopMusic(resetSource = false) {
      if (!state.config.musicEnabled || !state.config.musicUrl) return;
      let audio=document.getElementById('wopThemeMusic');
      if (!audio) { audio=document.createElement('audio'); audio.id='wopThemeMusic'; audio.preload='auto'; audio.volume=0.25; audio.controls=false; audio.loop=true; audio.style.display='none'; document.body.appendChild(audio); }
      if (resetSource || audio.src !== state.config.musicUrl) audio.src=state.config.musicUrl;
      audio.loop=true;
      // Jangan daftarkan musik website sebagai sesi media bernama di Android/Chrome.
      // Browser/OS tetap dapat menampilkan kontrol generik pada sebagian perangkat.
      try {
        if (navigator.mediaSession) {
          navigator.mediaSession.metadata = null;
          navigator.mediaSession.playbackState = 'none';
          ['play','pause','stop','seekbackward','seekforward','previoustrack','nexttrack'].forEach(action => {
            try { navigator.mediaSession.setActionHandler(action, null); } catch (_) {}
          });
        }
      } catch (_) {}
      audio.onended=()=>{ if (state.config.musicEnabled && state.config.musicUrl) { try { audio.currentTime=0; const p=audio.play(); if(p?.catch) p.catch(()=>{}); } catch(e){} } };
      const attempt=()=>{ if (!state.config.musicEnabled) return; const p=audio.play(); if(p?.catch) p.catch(()=>{}); };
      attempt();
      if (!window.__wopMusicGestureBound) {
        window.__wopMusicGestureBound=true;
        const resume=()=>{ const a=document.getElementById('wopThemeMusic'); if(a && a.paused && state.config.musicEnabled) { const p=a.play(); if(p?.catch)p.catch(()=>{}); } };
        ['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,resume,{passive:true}));
      }
    }

    // Jam, periode hari, tanggal, dan bulan mengikuti jam lokal perangkat secara real-time.
    function updateWopLiveClock() {
      const now = new Date();
      const hour = Number(new Intl.DateTimeFormat('id-ID', { hour: '2-digit', hourCycle: 'h23' }).format(now));
      const period = hour >= 4 && hour < 11 ? 'PAGI' : hour >= 11 && hour < 15 ? 'SIANG' : hour >= 15 && hour < 18 ? 'SORE' : 'MALAM';
      const clock = document.getElementById('wopLiveClock');
      const dayPeriod = document.getElementById('wopDayPeriod');
      const fullDate = document.getElementById('wopFullDate');
      const month = document.getElementById('wopLiveMonth');
      if (clock) clock.textContent = new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(now);
      if (dayPeriod) dayPeriod.textContent = period;
      if (fullDate) fullDate.textContent = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
      if (month) month.textContent = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(now);
    }
    updateWopLiveClock();
    setInterval(updateWopLiveClock, 1000);

    // BOOTSTRAP: jangan membuka sesi game hanya dari localStorage. Firebase Auth yang menentukan sesi.
    loadFromLocal();
    if (state.config.musicEnabled && state.config.musicUrl) startWopMusic(false);
    scheduleRender();
  </script>
</body>
</html>
