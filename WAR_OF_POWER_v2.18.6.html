    window.setBattleMode = function(mode) {
      battleState.mode = mode;
      battleState.allies = [];
      battleState.enemies = [];
      scheduleRender();
    };

    window.selectBattleHero = function(uid) {
      battleState.selectedHeroUid = uid;
      scheduleRender();
    };

    window.selectBattleShield = function(uid) {
      battleState.selectedShieldUid = uid;
      scheduleRender();
    };

    window.selectBattlePusaka = function(uid) {
      battleState.selectedPusakaUid = battleState.selectedPusakaUid === uid ? '' : uid;
      scheduleRender();
    };

    window.toggleBattleMedkit = function(uid) {
      const idx = battleState.selectedMedkitUids.indexOf(uid);
      if (idx >= 0) {
        battleState.selectedMedkitUids.splice(idx, 1);
      } else {
        if (battleState.selectedMedkitUids.length >= 3) {
          battleState.selectedMedkitUids.shift();
        }
        battleState.selectedMedkitUids.push(uid);
      }
      scheduleRender();
    };

    window.buyEmergencyMedkitPack = async function() {
      const user = getCurrentUser();
      if (!user) return;
      for (let i = 0; i < 3; i++) {
        user.inventory.push({
          uid: `med_pack_${Date.now()}_${i}`,
          name: 'Medkit Taktis',
          category: 'MEDKIT',
          rarity: 'COMMON',
          hp: 750,
          damage: 0,
          desc: 'Kotak medis lapangan memulihkan +750 HP Hero saat bertempur.',
          image: makeSvgBadge('MEDKIT', '#059669', '#064e3b', '💊')
        });
      }
      await saveUser(user);
      initBattleSetupDefaults();
      showToast('+3 Medkit Taktis berhasil ditambahkan ke Tas!', 'success');
      scheduleRender();
    };

    window.inviteOnlineFriendToTeam = function(friendEmail) {
      if (Number(String(battleState.mode).split('v')[0]) <= 1) return;
      const friend = state.users[friendEmail];
      if (!friend) return;
      const existingIdx = battleState.allies.findIndex((a) => a.email === friendEmail);
      if (existingIdx >= 0) {
        battleState.allies.splice(existingIdx, 1);
        scheduleRender();
        return;
      }
      if (battleState.allies.length >= 2) {
        return showToast('Tim sudah penuh (Maksimal 3 pemain termasuk kamu)!', 'info');
      }
      ensureUserAccountIntegrity(friend);
      const fHero = (friend.inventory || []).find((i) => i.category === 'HERO') || createStarterInventory(friend.id)[0];
      const fShield = (friend.inventory || []).find((i) => i.category === 'PERISAI') || createStarterInventory(friend.id)[1];
      const fPusaka = (friend.inventory || []).find((i) => i.category === 'PUSAKA SAKTI') || createStarterInventory(friend.id)[5];

      battleState.allies.push({
        id: friend.id,
        email: friend.email,
        username: friend.username,
        rank: friend.rank,
        level: friend.level,
        avatar: friend.avatar,
        isFriend: true,
        hero: fHero,
        shield: fShield,
        pusaka: fPusaka
      });
      showToast(`${friend.username} bergabung ke tim kamu!`, 'success');
      scheduleRender();
    };

    window.findSmartMatchmakingSquad = function() {
      const user = getCurrentUser();
      if (!user) return;
      const usedNames = new Set([user.username, ...battleState.allies.map((a) => a.username)]);
      const teamSize = Math.max(1, Number(String(battleState.mode).split('v')[0]) || 1);
      const neededAllies = teamSize - 1;
      const neededEnemies = teamSize;

      while (battleState.allies.length < neededAllies) {
        battleState.allies.push(generateProPlayerCombatant(usedNames));
      }
      battleState.enemies = [];
      for (let i = 0; i < neededEnemies; i++) {
        battleState.enemies.push(generateProPlayerCombatant(usedNames));
      }
      playBeep(720, 0.09);
      showToast('Rekan tim & lawan pemain tangguh ditemukan!', 'success');
      scheduleRender();
    };

    window.startBattleMatch = function() {
      const user = getCurrentUser();
      if (!user) return;
      initBattleSetupDefaults();

      const inv = user.inventory || [];
      const hero = inv.find((i) => i.uid === battleState.selectedHeroUid && i.category === 'HERO');
      const shield = inv.find((i) => i.uid === battleState.selectedShieldUid && i.category === 'PERISAI');
      const medkits = battleState.selectedMedkitUids
        .map((uid) => inv.find((i) => i.uid === uid && i.category === 'MEDKIT'))
        .filter(Boolean);
      const pusaka = inv.find((i) => i.uid === battleState.selectedPusakaUid && i.category === 'PUSAKA SAKTI') || null;

      if (!hero) return showToast('Wajib pilih minimal 1 Hero terlebih dahulu!', 'error');
      if (!shield) return showToast('Wajib pilih minimal 1 Perisai terlebih dahulu!', 'error');
      if (medkits.length > 3) return showToast('Maksimal 3 Medkit dapat dibawa ke perang.', 'error');

      const teamSize = Math.max(1, Number(String(battleState.mode).split('v')[0]) || 1);
      const neededAllies = teamSize - 1;
      const neededEnemies = teamSize;
      if (battleState.allies.length < neededAllies || battleState.enemies.length < neededEnemies) {
        findSmartMatchmakingSquad();
      }

      const avgMedkitHeal = Math.round(medkits.reduce((s, m) => s + Number(m.hp || 750), 0) / medkits.length);

      const buildUnit = (pData, isMe = false) => {
        const maxHp = Number(pData.hero.hp || 3000);
        const startShield = Math.round(Number(pData.shield?.hp || 650) * 0.5);
        return {
          uid: (isMe ? 'me_' : 'unit_') + pData.id + '_' + Math.random().toString(36).slice(2, 5),
          id: pData.id,
          username: pData.username,
          avatar: pData.avatar,
          rank: pData.rank,
          isMe,
          hero: pData.hero,
          shieldItem: pData.shield,
          pusakaItem: pData.pusaka,
          maxHp,
          hp: maxHp,
          maxShield: Number(pData.shield?.hp || 650),
          shield: startShield,
          medkitsLeft: isMe ? medkits.length : 2,
          medkitHeal: isMe ? (medkits.length ? avgMedkitHeal : 750) : 750,
          medkitUids: isMe ? medkits.map(m => m.uid) : [],
          pusakaCooldown: 0,
          totalDamageDealt: 0
        };
      };

      const meUnit = buildUnit({
        id: user.id,
        username: user.username,
        avatar: user.avatar,
        rank: user.rank,
        hero,
        shield,
        pusaka
      }, true);

      battleState.allyTeam = [meUnit, ...battleState.allies.map((a) => buildUnit(a, false))];
      battleState.enemyTeam = battleState.enemies.map((e) => buildUnit(e, false));
      battleState.step = 'arena';
      battleState.turnSide = 'ally';
      battleState.turnIndex = 0;
      battleState.selectedTargetIndex = 0;
      battleState.busyTurn = false;
      battleState.winnerSide = null;
      battleState.rewardAmount = 0;
      battleState.rewardClaimed = false;
      battleState.currentBattleId = 'war_' + Date.now();
      battleState.logs = [
        `⚔️ Pertempuran ${battleState.mode.toUpperCase()} BATTLE dimulai!`,
        `👑 ${meUnit.username} menurunkan Hero ${hero.name} (${hero.hp} HP | ${hero.damage} DMG)!`
      ];
      playBeep(820, 0.12);
      scheduleRender();
    };

    function renderBattleArenaHTML(user) {
      const isPlayerTurn = battleState.turnSide === 'ally' && battleState.turnIndex === 0 && !battleState.busyTurn;
      const meUnit = battleState.allyTeam[0];

      if (battleState.enemyTeam[battleState.selectedTargetIndex]?.hp <= 0) {
        const nextAlive = battleState.enemyTeam.findIndex((e) => e.hp > 0);
        if (nextAlive >= 0) battleState.selectedTargetIndex = nextAlive;
      }

      const activeUnit = battleState.turnSide === 'ally'
        ? battleState.allyTeam[battleState.turnIndex]
        : battleState.enemyTeam[battleState.turnIndex];

      return `
        <div class="space-y-3 pb-6 relative">
          ${battleState.fxOverlay ? `
            <div class="fixed inset-0 z-50 pointer-events-none flex items-center justify-center">
              <div class="px-6 py-4 rounded-3xl bg-gradient-to-r from-amber-500/90 via-rose-600/90 to-purple-700/90 border-2 border-amber-300 text-center shadow-2xl animate-dragon-blast">
                <div class="text-4xl mb-1">${battleState.fxOverlay.emoji}</div>
                <div class="font-gaming font-black text-sm text-white tracking-wider">${escapeHTML(battleState.fxOverlay.text)}</div>
              </div>
            </div>
          ` : ''}

          <div class="glass-card rounded-2xl p-2.5 border border-amber-400/40 flex items-center justify-between gap-2">
            <div>
              <div class="font-gaming font-black text-xs text-amber-300">
                🛡️ ARENA ${battleState.mode.toUpperCase()}
              </div>
              <div class="text-[10px] text-cyan-300 font-bold">
                Giliran: <span class="text-white underline">${activeUnit ? escapeHTML(activeUnit.username) : '-'}</span>
                ${Number(String(battleState.mode).split('v')[0]) > 1 ? ` (Urutan ke-${battleState.turnIndex + 1})` : ''}
              </div>
            </div>
            <button onclick="confirmRetreatBattle()" class="px-2.5 py-1.5 rounded-xl bg-rose-950/80 border border-rose-500/50 text-rose-300 font-gaming font-bold text-[10px]">
              🏳️ MUNDUR
            </button>
          </div>

          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-[10px] font-gaming font-bold text-rose-400 px-1">
              <span>🔴 TIM LAWAN (Ketuk kartu untuk kunci target)</span>
              <span>${battleState.enemyTeam.filter((u) => u.hp > 0).length}/${battleState.enemyTeam.length} Hidup</span>
            </div>
            <div class="grid ${battleState.enemyTeam.length > 1 ? 'grid-cols-3' : 'grid-cols-1'} gap-2">
              ${battleState.enemyTeam.map((en, idx) => renderCombatUnitCard(en, idx, 'enemy')).join('')}
            </div>
          </div>

          <div class="flex items-center justify-center gap-2 py-0.5">
            <div class="h-px flex-1 bg-gradient-to-r from-transparent via-rose-500/50 to-amber-400"></div>
            <span class="px-3 py-0.5 rounded-full bg-slate-950 border border-amber-400/60 font-gaming font-black text-[10px] text-amber-300">VS</span>

          </div>

          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-[10px] font-gaming font-bold text-cyan-300 px-1">
              <span>🔵 TIM KAMU (Serangan Berurutan)</span>
              <span>${battleState.allyTeam.filter((u) => u.hp > 0).length}/${battleState.allyTeam.length} Hidup</span>
            </div>
            <div class="grid ${battleState.allyTeam.length > 1 ? 'grid-cols-3' : 'grid-cols-1'} gap-2">
              ${battleState.allyTeam.map((al, idx) => renderCombatUnitCard(al, idx, 'ally')).join('')}
            </div>
          </div>

          <div class="glass-card rounded-2xl p-3 border ${isPlayerTurn ? 'border-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.25)]' : 'border-slate-800'} space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-gaming font-black text-xs ${isPlayerTurn ? 'text-amber-300' : 'text-slate-400'}">
                ${isPlayerTurn ? '⚡ GILIRAN KAMU MENYERANG!' : '⏳ MENUNGGU GILIRAN TIM / LAWAN...'}
              </span>
              ${meUnit ? `<span class="text-[10px] text-emerald-300 font-bold">💊 Medkit: ${meUnit.medkitsLeft}/3</span>` : ''}
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button ${!isPlayerTurn ? 'disabled' : ''} onclick="playerBattleAction('attack')" class="p-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-orange-500 text-slate-950 font-gaming font-black text-[11px] shadow active:scale-95 disabled:opacity-40 text-left">
                <div>⚔️ SERANG HERO</div>
                <div class="text-[9px] font-sans font-extrabold opacity-90">DMG ~${meUnit ? meUnit.hero.damage : 0}</div>
              </button>

              <button ${(!isPlayerTurn || !meUnit?.pusakaItem || meUnit.pusakaCooldown > 0) ? 'disabled' : ''} onclick="playerBattleAction('pusaka')" class="p-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-gaming font-black text-[11px] shadow active:scale-95 disabled:opacity-40 text-left">
                <div>🐉 ${meUnit?.pusakaItem ? escapeHTML(meUnit.pusakaItem.name.slice(0, 14)) : 'PUSAKA SAKTI'}</div>
                <div class="text-[9px] font-sans font-extrabold opacity-90">
                  ${!meUnit?.pusakaItem ? 'Tidak dibawa' : meUnit.pusakaCooldown > 0 ? `Cooldown ${meUnit.pusakaCooldown} Giliran` : `Jurus DMG ~${meUnit.pusakaItem.damage}`}
                </div>
              </button>

              <button ${!isPlayerTurn ? 'disabled' : ''} onclick="playerBattleAction('shield')" class="p-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-sky-500 text-slate-950 font-gaming font-black text-[11px] shadow active:scale-95 disabled:opacity-40 text-left">
                <div>🔰 PERISAI</div>
                <div class="text-[9px] font-sans font-extrabold opacity-90">+${meUnit ? Math.round(meUnit.maxShield * 0.65) : 400} Shield</div>
              </button>

                <div>💊 PAKAI MEDKIT</div>
                <div class="text-[9px] font-sans font-extrabold opacity-90">Heal +${meUnit ? meUnit.medkitHeal : 750} HP (${meUnit ? meUnit.medkitsLeft : 0})</div>
              </button>
            </div>
          </div>

          <div class="glass-card rounded-2xl p-2.5 border border-slate-800 space-y-1 max-h-28 overflow-y-auto">
            <div class="text-[9px] font-gaming font-bold text-slate-400">📜 LOG ARENA PEPERANGAN</div>
            ${battleState.logs.slice(0, 6).map((l) => `
              <div class="text-[11px] text-slate-200 leading-snug border-b border-slate-800/60 pb-1">${escapeHTML(l)}</div>
            `).join('')}
          </div>
        </div>
      `;

    function renderCombatUnitCard(unit, idx, side) {
      const isDead = unit.hp <= 0;
      const isCurrentTurn = battleState.turnSide === side && battleState.turnIndex === idx && !isDead;
      const isTargetedEnemy = side === 'enemy' && battleState.selectedTargetIndex === idx && !isDead;
      const isHit = battleState.hitTargetId === unit.uid;
      const hpPct = Math.max(0, Math.min(100, Math.round((unit.hp / unit.maxHp) * 100)));
      const shieldPct = unit.maxShield > 0 ? Math.max(0, Math.min(100, Math.round((unit.shield / unit.maxShield) * 100))) : 0;

      return `
        <div onclick="${side === 'enemy' && !isDead ? `selectEnemyBattleTarget(${idx})` : ''}"
             class="relative rounded-2xl p-2 bg-slate-950/95 border-2 transition-all ${isDead ? 'opacity-40 grayscale border-slate-800' : isCurrentTurn ? 'border-amber-400 ring-2 ring-amber-400/50 scale-[1.02]' : isTargetedEnemy ? 'border-rose-500 shadow-[0_0_14px_rgba(244,63,94,0.45)]' : 'border-slate-800'} ${isHit ? 'animate-hit-shake' : ''} ${side === 'enemy' && !isDead ? 'cursor-pointer' : ''}">

          ${battleState.floatDmg && battleState.floatDmg.unitId === unit.uid ? `
            <div class="absolute top-1/3 left-1/2 z-30 font-gaming font-black text-sm ${battleState.floatDmg.color} drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)] animate-float-dmg whitespace-nowrap pointer-events-none">
              ${escapeHTML(battleState.floatDmg.text)}
            </div>
          ` : ''}

          ${isTargetedEnemy ? `<span class="absolute -top-2 right-1.5 px-1.5 py-0.2 rounded bg-rose-600 text-white font-gaming font-black text-[8px]">🎯 TARGET</span>` : ''}
          ${isCurrentTurn ? `<span class="absolute -top-2 left-1.5 px-1.5 py-0.2 rounded bg-amber-400 text-slate-950 font-gaming font-black text-[8px]">⚡ GILIRAN</span>` : ''}

          <div class="flex items-center gap-1.5">
            <img src="${unit.hero.image}" class="w-9 h-9 rounded-xl object-cover border border-amber-400/50 shrink-0 bg-slate-900" />
            <div class="min-w-0 flex-1">
              <div class="text-[10px] font-bold text-white truncate">${escapeHTML(unit.username)}</div>
              <div class="text-[8px] text-amber-300 truncate">${escapeHTML(unit.hero.name)}</div>
            </div>
          </div>

          <div class="mt-1.5 space-y-1">
            <div class="flex justify-between text-[8px] font-bold">
              <span class="text-rose-400">❤️ HP</span>
              <span class="text-white">${isDead ? 'GUGUR' : `${unit.hp}/${unit.maxHp}`}</span>
            </div>
            <div class="w-full h-1.5 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-rose-500 to-emerald-400 transition-all duration-300" style="width:${hpPct}%"></div>
            </div>

            <div class="flex justify-between text-[8px] font-bold">
              <span class="text-cyan-300">🔰 Shield</span>
              <span class="text-cyan-200">${unit.shield}</span>
            </div>
            <div class="w-full h-1 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full bg-cyan-400 transition-all duration-300" style="width:${shieldPct}%"></div>
            </div>
          </div>

          <div class="mt-1.5 pt-1 border-t border-slate-800/80 flex items-center justify-between gap-1 text-[9px]">
            <span title="Perisai: ${escapeHTML(unit.shieldItem?.name || '-')}">🔰</span>
            <span title="Pusaka: ${escapeHTML(unit.pusakaItem?.name || '-')}" class="${unit.pusakaItem ? 'opacity-100' : 'opacity-30'}">🐉</span>
            <span class="text-emerald-300 font-bold">💊×${unit.medkitsLeft}</span>
          </div>
        </div>
      `;
    }

    window.selectEnemyBattleTarget = function(idx) {
      if (battleState.enemyTeam[idx] && battleState.enemyTeam[idx].hp > 0) {
        battleState.selectedTargetIndex = idx;
        scheduleRender();
      }
    };

    window.confirmRetreatBattle = function() {
      battleState.step = 'setup';
      battleState.busyTurn = false;
      scheduleRender();
    };

    function applyDamageToUnit(attacker, target, rawDamage, isPusaka = false) {
      const variance = 0.92 + Math.random() * 0.18;
      let dmg = Math.round(rawDamage * variance);
      let absorbed = 0;

      if (target.shield > 0) {
        absorbed = Math.min(target.shield, dmg);
        target.shield -= absorbed;
        dmg -= absorbed;
      }
      target.hp = Math.max(0, target.hp - dmg);
      attacker.totalDamageDealt += (dmg + absorbed);

      battleState.hitTargetId = target.uid;
      battleState.floatDmg = {
        unitId: target.uid,
        text: isPusaka ? `🔥 -${dmg + absorbed} NAGA!` : `-${dmg + absorbed}`,
        color: isPusaka ? 'text-amber-300' : 'text-rose-400'
      };
      setTimeout(() => {
        battleState.hitTargetId = null;
        battleState.floatDmg = null;
        scheduleRender();
      }, 950);

      return { hpDamage: dmg, shieldAbsorbed: absorbed };
    }

    window.playerBattleAction = function(actionType) {
      if (battleState.turnSide !== 'ally' || battleState.turnIndex !== 0 || battleState.busyTurn) return;
      const meUnit = battleState.allyTeam[0];
      if (!meUnit || meUnit.hp <= 0) return;

      battleState.busyTurn = true;
      if (meUnit.pusakaCooldown > 0) meUnit.pusakaCooldown--;

      const target = battleState.enemyTeam[battleState.selectedTargetIndex] || battleState.enemyTeam.find((e) => e.hp > 0);

      if (actionType === 'attack' && target) {
        const res = applyDamageToUnit(meUnit, target, meUnit.hero.damage, false);
        battleState.fxOverlay = { emoji: '⚔️', text: `TEBASAN ${meUnit.hero.name.toUpperCase()}!` };
        battleState.logs.unshift(`⚔️ ${meUnit.username} menyerang ${target.username} (-${res.hpDamage + res.shieldAbsorbed} DMG)!`);
        playBeep(660, 0.09);
      } else if (actionType === 'pusaka' && meUnit.pusakaItem && target) {
        meUnit.pusakaCooldown = 2;
        const res = applyDamageToUnit(meUnit, target, meUnit.pusakaItem.damage, true);
        battleState.fxOverlay = { emoji: '🐉🔥', text: `JURUS ${meUnit.pusakaItem.name.toUpperCase()}!` };
        battleState.logs.unshift(`🐉 ${meUnit.username} melepaskan ${meUnit.pusakaItem.name} ke ${target.username} (-${res.hpDamage + res.shieldAbsorbed} DMG)!`);
        playBeep(880, 0.14);
      } else if (actionType === 'shield') {
        const addSh = Math.round(meUnit.maxShield * 0.65);
        meUnit.shield = Math.min(meUnit.maxShield, meUnit.shield + addSh);
        battleState.fxOverlay = { emoji: '🔰', text: `PERISAI AKTIF (+${addSh} SHIELD)` };
        battleState.floatDmg = { unitId: meUnit.uid, text: `+${addSh} SHIELD`, color: 'text-cyan-300' };
        battleState.logs.unshift(`🔰 ${meUnit.username} mengaktifkan ${meUnit.shieldItem.name} (+${addSh} Shield)!`);
        playBeep(540, 0.09);
      } else if (actionType === 'medkit' && meUnit.medkitsLeft > 0) {
        meUnit.medkitsLeft -= 1;
        if (meUnit.isMe && meUnit.medkitUids?.length) { const usedUid = meUnit.medkitUids.shift(); const currentUser = getCurrentUser(); if (currentUser) { currentUser.inventory = currentUser.inventory.filter(it => it.uid !== usedUid); saveUser(currentUser); } }
        const healAmt = meUnit.medkitHeal;
        meUnit.hp = Math.min(meUnit.maxHp, meUnit.hp + healAmt);
        battleState.fxOverlay = { emoji: '💊💚', text: `MEDKIT HEAL (+${healAmt} HP)` };
        battleState.floatDmg = { unitId: meUnit.uid, text: `+${healAmt} HP`, color: 'text-emerald-400' };
        battleState.logs.unshift(`💊 ${meUnit.username} memakai Medkit (+${healAmt} HP)!`);
        playBeep(760, 0.09);
      }

      setTimeout(() => {
        battleState.fxOverlay = null;
        scheduleRender();
      }, 800);

      scheduleRender();
      setTimeout(() => advanceBattleTurn(), 1050);
    };

    function advanceBattleTurn() {
      const allyAlive = battleState.allyTeam.some((u) => u.hp > 0);
      const enemyAlive = battleState.enemyTeam.some((u) => u.hp > 0);

      if (!enemyAlive) {
        finishBattleMatch('ally');
        return;
      }
      if (!allyAlive) {
        finishBattleMatch('enemy');
        return;
      }

      if (battleState.turnSide === 'ally') {
        let nextAlly = battleState.turnIndex + 1;
        while (nextAlly < battleState.allyTeam.length && battleState.allyTeam[nextAlly].hp <= 0) {
          nextAlly++;
        }
        if (nextAlly < battleState.allyTeam.length) {
          battleState.turnIndex = nextAlly;
          battleState.busyTurn = true;
          scheduleRender();
          setTimeout(() => runAiUnitTurn('ally', nextAlly), 950);
          return;
        } else {
          battleState.turnSide = 'enemy';
          const firstEnemy = battleState.enemyTeam.findIndex((u) => u.hp > 0);
          battleState.turnIndex = firstEnemy >= 0 ? firstEnemy : 0;
          battleState.busyTurn = true;
          scheduleRender();
          setTimeout(() => runAiUnitTurn('enemy', battleState.turnIndex), 950);
          return;
        }
      } else {
        let nextEnemy = battleState.turnIndex + 1;
        while (nextEnemy < battleState.enemyTeam.length && battleState.enemyTeam[nextEnemy].hp <= 0) {
          nextEnemy++;
        }
        if (nextEnemy < battleState.enemyTeam.length) {
          battleState.turnIndex = nextEnemy;
          battleState.busyTurn = true;
          scheduleRender();
          setTimeout(() => runAiUnitTurn('enemy', nextEnemy), 950);
          return;
        } else {
          battleState.turnSide = 'ally';
          const firstAlly = battleState.allyTeam.findIndex((u) => u.hp > 0);
          battleState.turnIndex = firstAlly >= 0 ? firstAlly : 0;
          battleState.busyTurn = battleState.turnIndex !== 0;
          scheduleRender();
          if (battleState.turnIndex !== 0) {
            setTimeout(() => runAiUnitTurn('ally', battleState.turnIndex), 950);
          }
        }
      }
    }

    function runAiUnitTurn(side, idx) {
      const ownTeam = side === 'ally' ? battleState.allyTeam : battleState.enemyTeam;
      const oppTeam = side === 'ally' ? battleState.enemyTeam : battleState.allyTeam;
      const actor = ownTeam[idx];
      if (!actor || actor.hp <= 0) {
        advanceBattleTurn();
        return;
      }

      if (actor.pusakaCooldown > 0) actor.pusakaCooldown--;

      if (actor.hp < actor.maxHp * 0.38 && actor.medkitsLeft > 0) {
        actor.medkitsLeft--;
        actor.hp = Math.min(actor.maxHp, actor.hp + actor.medkitHeal);
        battleState.floatDmg = { unitId: actor.uid, text: `+${actor.medkitHeal} HP`, color: 'text-emerald-400' };
        battleState.logs.unshift(`💊 ${actor.username} menggunakan Medkit (+${actor.medkitHeal} HP)!`);
      } else {
        const aliveTargets = oppTeam.filter((u) => u.hp > 0);
        if (aliveTargets.length === 0) {
          advanceBattleTurn();
          return;
        }
        aliveTargets.sort((a, b) => a.hp - b.hp);
        const target = aliveTargets[0];

        if (actor.pusakaItem && actor.pusakaCooldown === 0 && Math.random() < 0.45) {
          actor.pusakaCooldown = 2;
          const res = applyDamageToUnit(actor, target, actor.pusakaItem.damage, true);
          battleState.fxOverlay = { emoji: '🐉', text: `${actor.username}: ${actor.pusakaItem.name}!` };
          battleState.logs.unshift(`🐉 ${actor.username} memicu ${actor.pusakaItem.name} ke ${target.username} (-${res.hpDamage + res.shieldAbsorbed} DMG)!`);
        } else {
          const res = applyDamageToUnit(actor, target, actor.hero.damage, false);
          battleState.logs.unshift(`⚔️ ${actor.username} menyerang ${target.username} (-${res.hpDamage + res.shieldAbsorbed} DMG)!`);
        }
      }

      playBeep(side === 'ally' ? 620 : 380, 0.08);
      setTimeout(() => {
        battleState.fxOverlay = null;
        scheduleRender();
      }, 750);

      scheduleRender();
      setTimeout(() => advanceBattleTurn(), 1000);
    }

    async function finishBattleMatch(winnerSide) {
      const user = getCurrentUser();
      battleState.step = 'result';
      battleState.winnerSide = winnerSide;
      battleState.busyTurn = false;

      const isWin = winnerSide === 'ally';
      const teamSize = Math.max(1, Number(String(battleState.mode).split('v')[0]) || 1);
      const perPlayerWinReward = Math.max(0, Number(state.config.missionRewards?.winDiamond ?? 20));
      const reward = isWin ? perPlayerWinReward : 0;
      battleState.rewardAmount = reward;
      battleState.rewardClaimed = false;

      if (user) {
        const meUnit = battleState.allyTeam[0];
        if (isWin) {
          user.level = Number(user.level || 1) + 1;

          if (Number(String(battleState.mode).split('v')[0]) > 1) {
            for (const ally of battleState.allies) {
              if (ally.isFriend && ally.email && state.users[ally.email]) {
                const friendAcc = state.users[ally.email];
                friendAcc.diamond = Number(friendAcc.diamond || 0) + perPlayerWinReward;
                friendAcc.stats = friendAcc.stats || {}; friendAcc.stats.battleMissionProgress = Number(friendAcc.stats.battleMissionProgress || 0) + 1;
                friendAcc.messages = friendAcc.messages || [];
                friendAcc.messages.unshift({
                  id: 'team_win_' + Date.now() + '_' + friendAcc.id,
                  title: `🏆 KEMENANGAN TEAM BATTLE (+${perPlayerWinReward} 💎)`,
                  body: `Selamat! Tim kamu bersama ${user.username} menang Team Battle! Kamu mendapat +${perPlayerWinReward} Diamond.`,
                  from: 'ARENA PEPERANGAN',
                  time: new Date().toLocaleString('id-ID'),
                  read: false
                });
                await saveUser(friendAcc);
              }
            }
          }
        }

        user.stats = user.stats || {}; user.stats.battleMissionProgress = isWin ? Number(user.stats.battleMissionProgress || 0) + 1 : 0;
        if (!isWin) user.stats.claimedBattle = [];
        user.battleHistory = user.battleHistory || [];
        user.battleHistory.unshift({
          id: battleState.currentBattleId || ('war_' + Date.now()),
          mode: `TEAM BATTLE ${battleState.mode.toUpperCase()}`, 
          result: isWin ? 'WIN' : 'LOSE',
          heroName: meUnit?.hero?.name || 'Hero',
          heroImage: meUnit?.hero?.image || '',
          damageDealt: meUnit?.totalDamageDealt || 0,
          allyNames: battleState.allyTeam.map((u) => u.username),
          enemyNames: battleState.enemyTeam.map((u) => u.username),
          reward,
          claimed: !isWin,
          time: new Date().toLocaleString('id-ID')
        });

        await saveUser(user);
        playBeep(isWin ? 920 : 220, 0.22);
      }

      scheduleRender();
    }

    window.claimCurrentBattleDiamond = async function() {
      const user = getCurrentUser();
      if (!user || battleState.winnerSide !== 'ally' || battleState.rewardClaimed) return;
      const amt = Number(battleState.rewardAmount || 0);
      if (amt <= 0) return;

      battleState.rewardClaimed = true;
      user.diamond = Number(user.diamond || 0) + amt;

      const histEntry = (user.battleHistory || []).find((h) => h.id === battleState.currentBattleId);
      if (histEntry) histEntry.claimed = true;

      await saveUser(user);
      playBeep(980, 0.16);
      showToast(`💎 BERHASIL CLAIM +${amt.toLocaleString('id-ID')} DIAMOND!`, 'success');
      scheduleRender();
    };

    window.toggleBattleHistorySelectMode = function() { battleHistorySelectMode = !battleHistorySelectMode; selectedBattleHistoryIds.clear(); scheduleRender(); };
    window.toggleBattleHistorySelection = function(id, checked) { if (checked) selectedBattleHistoryIds.add(id); else selectedBattleHistoryIds.delete(id); };
    window.deleteSelectedBattleHistory = async function() {
      const user=getCurrentUser(); if(!user) return;
      if(!selectedBattleHistoryIds.size) return showToast('Pilih riwayat yang ingin dihapus.','error');
      if(!window.confirm(`Hapus ${selectedBattleHistoryIds.size} riwayat perang terpilih?`)) return;
      user.battleHistory=(user.battleHistory||[]).filter(h=>!selectedBattleHistoryIds.has(h.id));
      selectedBattleHistoryIds.clear(); battleHistorySelectMode=false; await saveUser(user); showToast('Riwayat terpilih berhasil dihapus.','success'); scheduleRender();
    };
    window.deleteAllBattleHistory = async function() {
      const user=getCurrentUser(); if(!user) return;
      if(!(user.battleHistory||[]).length) return showToast('Riwayat perang masih kosong.','error');
      if(!window.confirm('Hapus SEMUA riwayat perang? Tindakan ini tidak dapat dibatalkan.')) return;
      user.battleHistory=[]; selectedBattleHistoryIds.clear(); battleHistorySelectMode=false; await saveUser(user); showToast('Semua riwayat perang berhasil dihapus.','success'); scheduleRender();
    };

    window.claimBattleHistoryDiamond = async function(battleId) {
      const user = getCurrentUser();
      if (!user) return;
      const entry = (user.battleHistory || []).find((h) => h.id === battleId);
      if (!entry || entry.result !== 'WIN' || entry.claimed) return;
      const amt = Number(entry.reward || 0);
      if (amt <= 0) return;

      entry.claimed = true;
      user.diamond = Number(user.diamond || 0) + amt;
      if (battleState.currentBattleId === battleId) {
        battleState.rewardClaimed = true;
      }
      await saveUser(user);
      playBeep(980, 0.16);
      showToast(`💎 BERHASIL CLAIM +${amt.toLocaleString('id-ID')} DIAMOND DARI RIWAYAT PERANG!`, 'success');
      scheduleRender();
    };

    function renderBattleResultHTML(user) {
      const isWin = battleState.winnerSide === 'ally';
      return `
        <div class="space-y-4 py-2">
          <div class="glass-card rounded-3xl p-5 border-2 ${isWin ? 'border-amber-400 shadow-[0_0_30px_rgba(251,191,36,0.35)]' : 'border-rose-500/60'} text-center space-y-3">
            <div class="text-5xl">${isWin ? '🏆' : '💀'}</div>
            <h2 class="font-gaming font-black text-xl ${isWin ? 'text-amber-300' : 'text-rose-400'}">
              ${isWin ? 'VICTORY! TIM KAMU MENANG!' : 'DEFEAT! TIM KAMU KALAH'}
            </h2>
            <p class="text-xs text-slate-300">
              ${isWin
                ? (Number(String(battleState.mode).split('v')[0]) > 1
                    ? 'Selamat! Silakan tekan tombol CLAIM DIAMOND di bawah untuk mengambil +1.000 Diamond kemenangan!'
                    : 'Selamat! Silakan tekan tombol CLAIM DIAMOND di bawah untuk mengambil +400 Diamond kemenangan!')
                : 'Tingkatkan Hero, Perisai, dan Pusaka Sakti di Luky Royale atau Toko lalu coba lagi!'}
            </p>

            ${isWin ? `
              <div class="p-3.5 rounded-2xl bg-slate-950/95 border border-amber-400/70 space-y-2.5">
                <div class="text-[10px] font-gaming font-bold text-amber-200 tracking-wider">HADIAH KEMENANGAN ARENA</div>
                <div class="font-gaming font-black text-xl text-cyan-300">+${battleState.rewardAmount.toLocaleString('id-ID')} 💎 DIAMOND</div>
                ${battleState.rewardClaimed ? `
                  <div class="w-full py-3 rounded-xl bg-emerald-950/90 border border-emerald-400 text-emerald-300 font-gaming font-black text-xs">
                    ✅ DIAMOND SUDAH DI-CLAIM (+${battleState.rewardAmount.toLocaleString('id-ID')} 💎)
                  </div>
                ` : `
                  <button onclick="claimCurrentBattleDiamond()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-400 via-yellow-300 to-emerald-400 text-slate-950 font-gaming font-black text-sm tracking-wider animate-claim-btn">
                    💎 CLAIM DIAMOND (+${battleState.rewardAmount.toLocaleString('id-ID')} 💎)
                  </button>
                `}
              </div>
            ` : ''}

            <div class="p-3 rounded-2xl bg-slate-950 border border-slate-800 text-left space-y-1.5">
              <div class="text-[10px] font-gaming font-bold text-cyan-300">📊 STATISTIK DAMAGE TIM</div>
              ${battleState.allyTeam.map((u) => `
                <div class="flex items-center justify-between text-xs py-1 border-b border-slate-800/70">
                  <span class="font-bold text-white">${escapeHTML(u.username)} (${escapeHTML(u.hero.name)})</span>
                  <span class="font-gaming text-emerald-400 font-bold">⚔️ ${u.totalDamageDealt.toLocaleString('id-ID')} DMG</span>
                </div>
              `).join('')}
            </div>

            <div class="grid grid-cols-3 gap-2 pt-2">
              <button onclick="navigateTo('lobby')" class="py-3 rounded-xl bg-slate-800 text-white font-gaming font-bold text-[10px]">
                LOBBY
              </button>
              <button onclick="navigateTo('battle_history')" class="py-3 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-300 font-gaming font-bold text-[10px]">
                📜 RIWAYAT
              </button>
              <button onclick="resetBattleToSetup()" class="py-3 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-gaming font-black text-[10px]">
                🔄 PERANG LAGI
              </button>
            </div>
          </div>
        </div>
      `;
    }

    window.resetBattleToSetup = function() {
      battleState.step = 'setup';
      battleState.busyTurn = false;
      scheduleRender();
    };

    function renderBattleHistoryHTML(user) {
      const history = user.battleHistory || [];
      const totalWins = history.filter((h) => h.result === 'WIN').length;
      const totalLosses = history.filter((h) => h.result === 'LOSE').length;
      const winRate = history.length > 0 ? Math.round((totalWins / history.length) * 100) : 0;

      return `
        <div class="space-y-3.5 pb-6">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 class="font-gaming font-black text-base text-white flex items-center gap-2">📜 RIWAYAT PERANG</h2>
              <p class="text-[11px] text-slate-400">Catatan lengkap pertempuran &amp; status CLAIM Diamond</p>
            </div>
            <button onclick="navigateTo('battle')" class="px-3 py-1.5 rounded-xl bg-rose-500/20 border border-rose-400 text-rose-300 font-gaming font-bold text-[10px] shrink-0">
              ← Arena Perang
            </button>
          </div>

          <div class="flex flex-wrap gap-2"><button onclick="toggleBattleHistorySelectMode()" class="px-3 py-2 rounded-lg bg-cyan-500/20 border border-cyan-400 text-cyan-200 text-[10px] font-bold">${battleHistorySelectMode ? 'BATAL PILIH' : 'HAPUS PILIH'}</button><button onclick="deleteAllBattleHistory()" class="px-3 py-2 rounded-lg bg-rose-600 text-white text-[10px] font-bold">HAPUS SEMUA</button>${battleHistorySelectMode ? `<button onclick="deleteSelectedBattleHistory()" class="px-3 py-2 rounded-lg bg-amber-400 text-slate-950 text-[10px] font-black">HAPUS (${selectedBattleHistoryIds.size})</button>` : ''}</div>
          <div class="grid grid-cols-3 gap-2">
            <div class="glass-card p-2.5 rounded-xl border border-emerald-500/30 text-center">
              <div class="text-[9px] text-slate-400 font-bold">TOTAL MENANG</div>
              <div class="font-gaming font-black text-sm text-emerald-400 mt-0.5">${totalWins}</div>
            </div>
            <div class="glass-card p-2.5 rounded-xl border border-rose-500/30 text-center">
              <div class="text-[9px] text-slate-400 font-bold">TOTAL KALAH</div>
              <div class="font-gaming font-black text-sm text-rose-400 mt-0.5">${totalLosses}</div>
            </div>
            <div class="glass-card p-2.5 rounded-xl border border-amber-500/30 text-center">
              <div class="text-[9px] text-slate-400 font-bold">WIN RATE</div>
              <div class="font-gaming font-black text-sm text-amber-300 mt-0.5">${winRate}%</div>
            </div>
          </div>

          ${history.length === 0 ? `
            <div class="glass-card rounded-2xl p-8 text-center space-y-2 border border-slate-800">

    window.selectSpinMachine = function(idx) {
      if (isSpinning) return;
      activeMachineIdx = idx;
      scheduleRender();
    };

    window.executeSpin = async function(count) {
      if (isSpinning) return;
      const user = getCurrentUser();
      const machine = (state.config.spinMachines || [])[activeMachineIdx];
      if (!user || !machine || !machine.items || machine.items.length === 0) return;

      const beforeSpin = cloneWopRecord(user);
      const prices = getMachinePrices(machine);
      const cost = Number(prices[count] || count * 200);
      if (user.diamond < cost) {
        return showToast(`Diamond tidak cukup! Butuh ${cost} Diamond.`, 'error');
      }

      isSpinning = true;
      user.diamond -= cost;
      user.stats = user.stats || {};
      user.stats.spinCount = (user.stats.spinCount || 0) + count;
      renderApp();
      playSpinStartEffect();

      function pickWeightedItem() {
        const items = machine.items;
        const validItems = items.map((x, idx) => ({ item: x, index: idx, weight: Math.max(0, Number(x.chance ?? 10)) }));
        const totalW = validItems.reduce((s, x) => s + x.weight, 0);
        if (totalW <= 0) return { item: items[0], index: 0 };
        let r = Math.random() * totalW;
        for (let i = 0; i < validItems.length; i++) {
          r -= validItems[i].weight;
          if (r <= 0) return { item: validItems[i].item, index: validItems[i].index };
        }
        return { item: validItems[0].item, index: validItems[0].index };
      }

      const rewards = [];
      let lastIdx = 0;
      for (let i = 0; i < count; i++) {
        const picked = pickWeightedItem();
        rewards.push(picked.item);
        lastIdx = picked.index;
      }

      const totalBoxes = machine.items.length;
      const steps = 14 + lastIdx;
      let step = 0;
      const timer = setInterval(async () => {
        document.querySelectorAll('[id^="ffBox_"]').forEach((el) => el.classList.remove('ff-box-active'));
        const curBox = document.getElementById(`ffBox_${step % totalBoxes}`);
        if (curBox) curBox.classList.add('ff-box-active');
        playBeep(440 + (step % totalBoxes) * 55, 0.04);
        step++;

        if (step > steps) {
          clearInterval(timer);

          let totalWonDiamond = 0;
          let wonItemCount = 0;
          let zonkCount = 0;

          rewards.forEach((rw, idx) => {
            const rType = rw.rewardType || (rw.category === 'ZONK' ? 'ZONK' : rw.category === 'DIAMOND' ? 'DIAMOND' : 'ITEM');
            if (rType === 'ZONK') {
              zonkCount++;
            } else if (rType === 'DIAMOND') {
              const dmAmt = Math.max(0, Number(rw.diamondAmount || 0));
              totalWonDiamond += dmAmt;
              user.diamond += dmAmt;
            } else {
              wonItemCount++;
              user.inventory.push({
                uid: 'inv_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).slice(2, 6),
                name: rw.name,
                category: rw.category || 'HERO',
                rarity: rw.rarity || 'RARE',
                hp: rw.hp || 2500,
                damage: rw.damage || 450,
                desc: rw.desc,
                image: rw.image
              });
            }
          });

          user.level = (user.level || 1) + 1;
          let spinSaved = false;
          let spinSaveError = null;
          try { spinSaved = await saveSpinResultToCloud(user); }
          catch (cloudError) { spinSaveError = cloudError; console.warn('Penyimpanan hasil spin gagal:', cloudError?.code || cloudError); }
          if (!spinSaved) {
            restoreWopRecord(user, beforeSpin);
            state.users[String(user.email || '').toLowerCase()] = user;
            persistLocal();
            isSpinning = false;
            renderApp();
            const detail = spinSaveError ? `${spinSaveError.code || 'cloud-error'}: ${String(spinSaveError.message || spinSaveError).slice(0, 180)}` : 'cloud belum siap';
            showToast(`Spin dibatalkan agar Diamond tidak hilang (${detail}).`, 'error');
            return;
          }
          isSpinning = false;
          playBeep(zonkCount === rewards.length ? 220 : 880, 0.15);
          renderApp();

          const allZonk = zonkCount === rewards.length;
          openModal(`
            <div class="space-y-3 text-center">
              <h3 class="font-gaming font-black text-base ${allZonk ? 'text-rose-400' : 'text-amber-400'}">
                ${allZonk ? '💀 YAH ZONK! COBA LAGI!' : `🎉 HASIL LUKY ROYALE (${count}×)`}
              </h3>
              <div class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto">
                ${rewards.map((rw) => {
                  const rType = rw.rewardType || (rw.category === 'ZONK' ? 'ZONK' : rw.category === 'DIAMOND' ? 'DIAMOND' : 'ITEM');
                  return `
                    <div class="p-2.5 rounded-xl bg-slate-950 border ${rType === 'ZONK' ? 'border-slate-700 opacity-85' : 'border-amber-400/50'}">
                      <img src="${rw.image}" class="w-12 h-12 mx-auto rounded-lg object-cover" />
                      <div class="font-bold text-xs text-white mt-1 truncate">${escapeHTML(rw.name)}</div>
                      ${rType === 'ZONK'
                        ? `<div class="text-[10px] text-rose-400 font-gaming font-bold">ZONK (ZONK!)</div>`
                        : rType === 'DIAMOND'
                          ? `<div class="text-[10px] text-cyan-300 font-bold">💎 +${Number(rw.diamondAmount || 0).toLocaleString('id-ID')} DIAMOND</div>`
                          : `<div class="text-[9px] text-amber-300 font-bold">${rw.category} • ❤️ ${rw.hp || 0} | ⚔️ ${rw.damage || 0}</div>`}
                    </div>
                  `;
                }).join('')}
              </div>
              <p class="text-[11px] text-emerald-300 font-semibold">
                ${wonItemCount > 0 ? `${wonItemCount} Koleksi masuk Penyimpanan • ` : ''}
                ${totalWonDiamond > 0 ? `+${totalWonDiamond.toLocaleString('id-ID')} Diamond ditambahkan • ` : ''}
                ${zonkCount > 0 ? `${zonkCount}× Zonk` : ''}
              </p>
              <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-amber-400 text-slate-950 font-gaming font-black text-xs">MANTAP!</button>
            </div>
          `);
        }
      }, 50);
    };

    window.handleClaimRedeemCode = async function() {
      const user = getCurrentUser();
      const codeInput = document.getElementById('redeemInputCode')?.value.trim().toUpperCase();
      if (!user || !codeInput) return showToast('Masukkan kode redeem!', 'error');
      const claimantUid = String(firebaseUser?.uid || user.uid || '');
      if (!claimantUid || !db || !state.cloudReady) return showToast('Login Firebase dan koneksi cloud harus siap untuk klaim redeem.', 'error');
      const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_global', 'config');
      let claimedCode;
      try {
        // Transaksi pada satu dokumen config membuat pemeriksaan UID + pencatatan klaim atomik.
        claimedCode = await runTransaction(db, async (tx) => {
          const snap = await tx.get(configRef);
          if (!snap.exists()) throw new Error('Konfigurasi redeem belum tersedia.');
          const cloudConfig = snap.data() || {};
          const codes = Array.isArray(cloudConfig.redeemCodes) ? cloudConfig.redeemCodes.map(c => ({ ...c, usedBy: [...(c.usedBy || [])], claimRecords: [...(c.claimRecords || [])] })) : [];
          const index = codes.findIndex(c => String(c.code || '').toUpperCase() === codeInput);
          if (index < 0) throw new Error('Kode redeem tidak ditemukan.');
          const code = codes[index];
          if (code.active === false || (code.expiresAt && new Date(code.expiresAt).getTime() <= Date.now())) throw new Error('Kode redeem tidak aktif atau sudah kedaluwarsa.');
          if (code.claimRecords.some(r => r.uid === claimantUid) || code.usedBy.includes(claimantUid) || code.usedBy.includes(String(user.email || '').toLowerCase())) throw new Error('Akun ini sudah pernah menukar kode tersebut!');
          if (code.usedBy.length >= Number(code.maxUses || 100)) throw new Error('Kuota kode redeem sudah habis!');
          code.usedBy.push(claimantUid);
          code.claimRecords.push({ uid: claimantUid, email: String(user.email || '').toLowerCase(), username: String(user.username || 'PEMAIN'), playerId: String(user.id || ''), claimedAt: new Date().toLocaleString('id-ID') });
          tx.update(configRef, { redeemCodes: codes });
          return code;
        });
      } catch (error) {
        return showToast(error?.message || 'Klaim gagal. Periksa koneksi dan Firestore Rules.', 'error');
      }

      const before = cloneWopRecord(user);
      const diamondReward = Math.max(0, Number(claimedCode.diamond || 0));
      user.diamond = Number(user.diamond || 0) + diamondReward;
      let itemNotice = '';
      if (claimedCode.item && claimedCode.item.name) {
        user.inventory = user.inventory || [];
        const reward = claimedCode.item;
        user.inventory.push({
          uid: 'redeem_item_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
          name: String(reward.name).slice(0,50), category: reward.category || 'HERO', rarity: reward.rarity || 'LEGENDARY',
          damage: Math.max(0, Number(reward.damage || 0)), hp: Math.max(0, Number(reward.hp || 0)),
          image: reward.image || makeSvgBadge(String(reward.name).slice(0,10), '#7c3aed', '#1e1b4b', '🎁'),
          description: claimedCode.type === 'TRIAL' ? 'Hadiah item TRIAL dari OWNER.' : 'Hadiah kode redeem dari OWNER.',
          ...(claimedCode.type === 'TRIAL' && Number(claimedCode.trialHours) > 0
            ? { expiresAt: new Date(Date.now() + Number(claimedCode.trialHours) * 3600000).toISOString(), trialItem: true }
            : {})
        });
        itemNotice = ' + 1 item ' + reward.name + (claimedCode.type === 'TRIAL' ? ` (TRIAL ${Number(claimedCode.trialHours)} jam)` : '');
      }
      const saved = await saveUser(user);
      if (!saved) {
        restoreWopRecord(user, before);
        state.users[String(user.email || '').toLowerCase()] = user;
        persistLocal();
        // Rollback klaim jika profil hadiah gagal disimpan, tanpa menghapus klaim akun lain.
        try {
          await runTransaction(db, async tx => {
            const snap = await tx.get(configRef); if (!snap.exists()) return;
            const cfg = snap.data() || {}; const codes = (cfg.redeemCodes || []).map(c => ({ ...c, usedBy:[...(c.usedBy||[])], claimRecords:[...(c.claimRecords||[])] }));
            const c = codes.find(x => String(x.code||'').toUpperCase() === codeInput); if (!c) return;
            c.usedBy = c.usedBy.filter(x => x !== claimantUid); c.claimRecords = c.claimRecords.filter(x => x.uid !== claimantUid);
            tx.update(configRef, { redeemCodes: codes });
          });
        } catch (rollbackError) { console.warn('Rollback klaim redeem perlu pemeriksaan Owner:', rollbackError); }
        return showToast('Hadiah gagal disimpan. Klaim dibatalkan jika rollback cloud berhasil.', 'error');
      }
      const freshConfigSnap = await getDoc(configRef);
      if (freshConfigSnap.exists()) state.config.redeemCodes = freshConfigSnap.data().redeemCodes || state.config.redeemCodes;
      persistLocal();
      showToast(`Kode berhasil ditukar! +${diamondReward} Diamond${itemNotice}.`, 'success');
      scheduleRender();
    };

      user.stats[key].push(id);
      user.diamond = Number(user.diamond || 0) + Number(dm || 0);

    window.placeAuctionBid = async function() {
      const user = getCurrentUser();
      const auc = state.config.auction;
      if (!user || !auc || auc.closed || !auc.active || auc.settled) return;

      const amount = parseInt(document.getElementById('auctionBidInput').value, 10);
      if (!amount || amount < 100) return showToast('Minimal tawaran lelang adalah 100 Diamond!', 'error');

      auc.bids = auc.bids || [];
      const existing = auc.bids.find((b) => b.email === user.email);
      const prevBid = existing ? existing.amount : 0;

      if (amount <= prevBid) return showToast(`Tawaran baru harus lebih besar dari tawaranmu sebelumnya (${prevBid} DM)!`, 'error');
      const diff = amount - prevBid;
      if (user.diamond < diff) return showToast('Diamond tidak cukup untuk menaikkan tawaran!', 'error');

      user.diamond -= diff;
      if (existing) {
        existing.amount = amount;
        existing.username = user.username;
      } else {
        auc.bids.push({ email: user.email, id: user.id, username: user.username, amount });
      }

      await saveUser(user);
      await saveConfig();
      showToast(`Tawaran ${amount.toLocaleString('id-ID')} Diamond berhasil dipasang!`, 'success');
      scheduleRender();
    };

    function makeDirectChatId(emailA, emailB) {
      return [String(emailA || '').toLowerCase(), String(emailB || '').toLowerCase()].sort().map((x) => encodeURIComponent(x).replace(/_/g, '%5F')).join('__');
    }

    function directChatRef(chatId) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'wop_direct_chats', chatId);
    }

    async function connectDirectChat(friend) {
      if (activeDirectChatUnsub) { try { activeDirectChatUnsub(); } catch (e) {} activeDirectChatUnsub = null; }
      activeDirectChatMessages = [];
      activeDirectChatId = null;
      const user = getCurrentUser();
      if (!user || !friend || !friend.email || !db || !state.cloudReady || !firebaseUser) {
        renderFullscreenFriendChat();
        return false;
      }
      const participants = [String(user.email).toLowerCase(), String(friend.email).toLowerCase()].sort();
      const chatId = makeDirectChatId(participants[0], participants[1]);
      const parentRef = directChatRef(chatId);
      try {
        let parentSnap = null;
        try { parentSnap = await getDoc(parentRef); } catch (readError) { /* Dokumen baru dapat belum ada; percobaan create akan tetap diperiksa Rules. */ }
        if (!parentSnap || !parentSnap.exists()) {
          await setDoc(parentRef, { participants, createdAt: Date.now(), unreadFor: [] });
        } else {
          const existing = (parentSnap.data()?.participants || []).map((email) => String(email || '').toLowerCase());
          if (existing.length !== 2 || !existing.includes(participants[0]) || !existing.includes(participants[1])) {
            throw new Error('Peserta ruang chat tidak cocok.');
          }
        }
        activeDirectChatId = chatId;
        const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'wop_direct_chats', chatId, 'messages');
        activeDirectChatUnsub = onSnapshot(messagesRef, async (snap) => {
          activeDirectChatMessages = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => Number(a.createdAt || 0) - Number(b.createdAt || 0)).map((m) => ({
            ...m,
            from: m.senderName || m.from || 'PEMAIN',
            time: m.time || new Date(Number(m.createdAt || Date.now())).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
          }));
          // Saat ruang dibuka, tandai pesan masuk sebagai sudah dibaca oleh akun ini.
          for (const messageDoc of snap.docs) {
            const m = messageDoc.data() || {};
            const ownEmail = String(user.email || firebaseUser?.email || '').toLowerCase();
            if (m.senderEmail && String(m.senderEmail).toLowerCase() !== ownEmail && !(m.readBy || []).map((x) => String(x).toLowerCase()).includes(ownEmail)) {
              updateDoc(messageDoc.ref, { readBy: arrayUnion(ownEmail) }).catch((err) => console.warn('Status baca chat gagal:', err?.code || err));
            }
          }
          updateDoc(parentRef, { unreadFor: arrayRemove(String(user.email || firebaseUser?.email || '').toLowerCase()) }).catch(() => {});
          if (activeDirectChatId === chatId) renderFullscreenFriendChat();
        }, (error) => { console.warn('Listener pesan chat gagal:', error?.code || error); showToast(error?.code === 'permission-denied' ? 'Akses chat ditolak Firestore Rules. Periksa aturan chat.' : 'Koneksi chat terputus. Periksa internet lalu buka ulang chat.', 'error'); });
        return true;
      } catch (error) {
        console.warn('Ruang chat gagal dibuka:', error?.code || error);
        showToast(error?.code === 'permission-denied' ? 'Firestore menolak akses ruang chat. Aturan chat perlu diperbarui.' : 'Ruang chat belum tersambung. Periksa internet dan coba lagi.', 'error');
        return false;
      }
    }

    async function persistDirectChatMessage(friend, message) {
      const user = getCurrentUser();
      if (!user || !friend) throw new Error('Akun pengirim atau penerima chat tidak ditemukan.');
      if (!db || !state.cloudReady || !firebaseUser) {
        throw new Error('Firebase belum siap atau sesi akun terputus. Muat ulang halaman lalu login kembali.');
      }
      // Pemulihan otomatis: tombol KIRIM bisa ditekan sebelum koneksi ruang
      // chat selesai dibuat/dipastikan. Sambungkan kembali ruang aktif dahulu.
      if (!activeDirectChatId) {
        const connected = await connectDirectChat(friend);
        if (!connected || !activeDirectChatId) {
          throw new Error('Ruang chat belum berhasil tersambung. Periksa izin Firestore dan coba buka chat kembali.');
        }
      }
      const createdAt = Date.now();
      const stored = {
        id: message.id,
        senderEmail: String(user.email || firebaseUser?.email || '').toLowerCase(),
        senderName: user.username,
        type: message.type === 'sticker' ? 'sticker' : 'text',
        text: String(message.text || '').slice(0, 2000),
        stickerId: message.stickerId || '',
        createdAt,
        time: new Date(createdAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
        readBy: [String(user.email || firebaseUser?.email || '').toLowerCase()]
      };
      const msgRef = doc(db, 'artifacts', appId, 'public', 'data', 'wop_direct_chats', activeDirectChatId, 'messages', message.id);
      await setDoc(msgRef, stored);
      const preview = stored.type === 'sticker' ? '🎭 Mengirim Stiker' : stored.text;
      await updateDoc(directChatRef(activeDirectChatId), {
        lastMessage: { type: stored.type, text: preview, preview },
        lastSenderEmail: String(user.email || firebaseUser?.email || '').toLowerCase(),
        lastAt: createdAt,
        unreadFor: arrayUnion(String(friend.email || '').toLowerCase())
      });
    }

    window.handleJoinGroupByCode = async function() {
      const user = getCurrentUser();
      if (!user) return;
      const raw = document.getElementById('joinGroupCodeInput').value.trim().toUpperCase();
      if (!raw) return showToast('Masukkan kode atau link grup!', 'error');
      const matchCode = raw.match(/WOP-GRP-[A-Z0-9]+/) ? raw.match(/WOP-GRP-[A-Z0-9]+/)[0] : raw;
      try {
        if (!db || !state.cloudReady) throw new Error('Firebase belum tersambung.');
        const inviteSnap = await getDoc(groupInviteDocumentRef(matchCode));
        if (!inviteSnap.exists()) return showToast('Kode atau Link Grup tidak ditemukan!', 'error');
        const groupId = String(inviteSnap.data().groupId || '');
        if (!groupId) return showToast('Undangan grup tidak valid.', 'error');
        let grp = (state.config.groups || []).find((g) => g.id === groupId);
        if (grp && (grp.kickedMembers || []).includes(user.email)) return showToast('Kamu telah dikeluarkan dari grup ini dan tidak dapat bergabung kembali!', 'error');
        if (grp && (grp.members || []).includes(user.email)) {
          closeModal(); activeGroupId = grp.id; groupSubView = 'chat'; groupSilentMonitorMode = false; scheduleRender(); return;
        }
        // Firestore Rules memeriksa kode undangan dan daftar kickedMembers secara atomik.
        await updateDoc(groupDocumentRef(groupId), { members: arrayUnion(user.email) });
        const groupSnap = await getDoc(groupDocumentRef(groupId));
        if (!groupSnap.exists()) throw new Error('Grup tidak ditemukan setelah bergabung.');
        grp = { ...groupSnap.data(), id: groupSnap.id, messages: grp?.messages || [] };
        if (!(state.config.groups || []).some((g) => g.id === grp.id)) state.config.groups.push(grp);
        const joinMessage = {
          id: 'gmsg_' + Date.now(), type: 'system', senderName: 'SYSTEM',
          text: `${user.username} (${user.id}) bergabung melalui Link Undangan Grup.`,
          time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        };
        grp.messages.push(joinMessage);
        await saveGroupMessage(grp, joinMessage);
        closeModal(); activeGroupId = grp.id; groupSubView = 'chat'; groupSilentMonitorMode = false;
        showToast(`Berhasil bergabung ke grup ${grp.name}!`, 'success');
        scheduleRender();
      } catch (error) {
        console.warn('Gabung grup gagal:', error?.code || error);
        showToast(error?.code === 'permission-denied' ? 'Tidak dapat bergabung. Kode salah, akun pernah di-kick, atau izin grup ditolak.' : (error.message || 'Gagal bergabung ke grup.'), 'error');
      }
    };

                <div class="font-gaming font-bold text-xs text-cyan-300">👥 DAFTAR ANGGOTA GRUP (${(grp.members || []).length})</div>
                ${(grp.members || []).map((mEmail) => {

                          </div>

          ` : `
            <div id="groupChatFeed" class="flex-1 overflow-y-auto p-3 space-y-2.5 bg-[#050811]">

                const isMine = msg.senderEmail === user.email;

                return `
                  <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[82%] rounded-2xl p-2.5 ${msg.type === 'sticker' ? 'bg-transparent p-0' : isMine ? 'bg-emerald-950/90 border border-emerald-500/40 rounded-tr-none' : 'bg-slate-900/95 border border-slate-800 rounded-tl-none'}">

                      ${msg.type === 'sticker' ? `
                        <div class="my-0.5">${renderStickerGraphicHTML(msg.stickerId, 'w-24 h-24')}</div>
                      ` : msg.type === 'poll' ? `

                          <div class="text-[10px] font-gaming font-bold text-amber-300">📊 POLLING GRUP</div>
                          <div class="text-xs font-bold text-white">${escapeHTML(msg.question)}</div>
                          <div class="space-y-1.5">
                            ${(msg.options || []).map((opt, oIdx) => {
                              const votes = opt.voters || [];
                              const totalVotes = (msg.options || []).reduce((s, o) => s + (o.voters || []).length, 0);
                              const pct = totalVotes > 0 ? Math.round((votes.length / totalVotes) * 100) : 0;
                              const votedMe = votes.includes(user.email);
                              return `
                                <button ${isSilentMonitor ? 'disabled' : ''} onclick="voteInGroupPoll('${grp.id}', '${msg.id}', ${oIdx})" class="w-full text-left p-2 rounded-xl border transition relative overflow-hidden ${votedMe ? 'border-emerald-400 bg-emerald-500/15' : 'border-slate-700 bg-slate-950'}">

                              `;

                      ` : `

                <input id="groupChatTextInput" onkeydown="if(event.key==='Enter') sendGroupTextMessage('${grp.id}')" type="text" placeholder="Ketik pesan grup..." class="flex-1 px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:border-emerald-400 outline-none" />
                <button onclick="sendGroupTextMessage('${grp.id}')" class="px-3.5 py-2.5 rounded-xl bg-emerald-400 text-slate-950 font-gaming font-black text-xs shrink-0">KIRIM</button>

              <div class="p-2.5 bg-amber-500/15 border-t border-amber-400/40 text-center text-[11px] font-bold text-amber-300 shrink-0">
